/*INSULINA*/    {des: "2026-11-05T18:00:00+01:00", type: "TP", titre: "Projet INSULINA : la traduction programmée", resume: "Escape game au laboratoire de Clearwater, en 1984 : pour vérifier l'insuline fabriquée par des bactéries, il fallait reconstruire l'algorithme de traduction, le programmer en Python et traduire l'ARNm de l'insuline humaine. On a ensuite comparé des expériences de transgénèse et le code génétique de plusieurs êtres vivants, puis expliqué pourquoi des bactéries peuvent fabriquer de l'insuline humaine.", correction: [["L'algorithme du ribosome", "Les étapes dans l'ordre : partir du début de l'ARNm et repérer le premier codon AUG ; lire le codon (3 nucléotides) ; chercher l'acide aminé correspondant dans le tableau du code génétique ; si le codon est un codon stop, arrêter la traduction ; sinon, ajouter l'acide aminé au bout de la chaîne ; avancer de 3 nucléotides ; recommencer à partir de « lire le codon » ; enfin, afficher la chaîne obtenue. Les deux pièges : lire l'ARNm à l'envers et avancer d'un seul nucléotide. La traduction est réalisée par les ribosomes : ils lisent l'ARNm codon par codon, du codon initiateur AUG jusqu'à un codon stop, et associent à chaque codon un acide aminé selon le code génétique."], ["Le programme de traduction", "Trou 1 : on lit le codon à partir de la position i, donc arnm[i : i + 3]. Trou 2 : on avance de 3 nucléotides, donc i = i + 3. Dans le programme saboté, i = i + 1 décale la lecture d'un nucléotide à chaque tour et donne une protéine absurde : il faut avancer de 3. L'ARNm de l'insuline (333 nucléotides) donne 110 codons traduits, puis un codon stop : une chaîne de 110 acides aminés, la préproinsuline."], ["Les codes du vivant", "Dans les trois expériences (GFP de méduse dans une bactérie, GFP dans des souris, gènes de maïs et de bactérie dans le riz), le gène d'une espèce est traduit par les ribosomes du receveur, qui associent chaque codon au même acide aminé que chez le donneur : le receveur fabrique la même protéine. Chez la paramécie, en revanche, UAG code la glutamine : la traduction du gène de l'insuline ne s'arrête pas à ce codon et la protéine est différente. Il existe donc de rares exceptions."], ["La mission finale (rédaction évaluée)", "Un gène d'une espèce peut s'exprimer chez une autre : la GFP de méduse est fabriquée par des bactéries et des souris, et des gènes de maïs et de bactérie par le riz ; le receveur fabrique la même protéine que le donneur. De même, le gène humain de l'insuline introduit dans E. coli (transgénèse) est transcrit puis traduit par les ribosomes de la bactérie, qui fabrique des chaînes de même séquence que chez l'être humain. La correspondance entre codons et acides aminés est donc la même chez presque tous les êtres vivants : le code génétique est universel, à de rares exceptions près, comme la paramécie, chez qui UAG code la glutamine."]]},

   essentiel: {
    intro: {texte: [
     "Aux chapitres précédents, nous avons vu que l'ADN porte une information dans la séquence de ses nucléotides, et qu'une mutation peut modifier cette séquence et créer un nouvel allèle. Certaines mutations ont des effets visibles : dans la drépanocytose, une seule substitution dans le gène HBB modifie l'hémoglobine. Mais comment une suite de nucléotides, enfermée dans le noyau, peut-elle déterminer une protéine et, finalement, un caractère ?"
    ]},
    sections: [
     {titre: "De l'ADN à l'ARN messager : la transcription", blocs: [
      "Les **[[protéines|protéine]]** sont des molécules formées d'une ou de plusieurs chaînes d'**[[acides aminés|acide aminé]]**, de 20 sortes différentes. L'ordre des acides aminés détermine la forme de la protéine, donc sa fonction. Chez les eucaryotes, l'ADN des chromosomes se trouve dans le noyau, tandis que les protéines sont fabriquées dans le cytoplasme, au niveau des [[ribosomes|ribosome]]. Une information contenue dans le noyau doit donc être transportée jusqu'au cytoplasme.",
      "Cette information est d'abord copiée sous la forme d'un autre acide nucléique, l'**[[ARN]]**. L'ARN est formé d'un seul brin de nucléotides contenant du ribose et les bases A, U, C ou G : l'uracile (U) remplace la thymine (T).",
      {table: {legende: "L'ADN et l'ARN", entetes: ["", "ADN", "ARN"],
       lignes: [["Emplacement dans la cellule", "Noyau", "Noyau et cytoplasme"], ["Nombre de brins", "Deux", "Un"], ["Sucre", "Désoxyribose", "Ribose"], ["Bases", "A, T, C, G", "A, U, C, G"]]}},
      "Dans le noyau, la [[transcription]] d'un gène codant une protéine produit un [[pré-ARNm]], par complémentarité avec le [[brin transcrit]] de l'ADN. Les deux brins de l'ADN s'écartent sur la longueur du gène, et un seul d'entre eux sert de modèle : en face de A, T, C et G, l'ARN reçoit respectivement U, A, G et C. L'ARN obtenu a donc la même séquence que le brin non transcrit, U remplaçant T.",
      "Le pré-ARNm subit une [[maturation]] qui donne l'[[ARN messager|ARN messager (ARNm)]] (ARNm). Celui-ci est exporté vers le cytoplasme par les pores nucléaires. Au cours de la maturation, certaines portions du pré-ARNm sont éliminées. L'ARNm est donc un **intermédiaire** : il transporte l'information d'un gène jusqu'aux ribosomes, où elle est utilisée pour fabriquer une protéine.",
      {aside: "Repère historique", texte: "Dans les années 1950-1960, des chercheurs fournissent à des cellules des molécules radioactives pour suivre leur trajet. Un acide aminé radioactif se retrouve rapidement dans le cytoplasme, au niveau des ribosomes, et non dans le noyau. De l'ARN radioactif apparaît d'abord dans le noyau, puis passe dans le cytoplasme. En 1961, on montre qu'un ARN copié sur les gènes s'associe aux ribosomes pour diriger la synthèse des protéines : c'est l'ARN messager."}
     ]},
     {titre: "De l'ARN messager à la protéine : la traduction", blocs: [
      "Dans le cytoplasme, l'ARNm s'associe à des ribosomes, qui assemblent les acides aminés les uns à la suite des autres : c'est la **[[traduction]]**. L'ARNm est lu par groupes de trois nucléotides, les [[codons|codon]]. Avec 4 nucléotides différents, on peut former 4³ = 64 codons, assez pour désigner les 20 acides aminés ; des groupes de deux nucléotides n'en donneraient que 4² = 16.",
      "Le [[code génétique]] est le système de correspondance entre chaque codon et un acide aminé. Il a été déchiffré entre 1961 et 1966. La traduction commence au [[codon initiateur|codon initiateur / codon stop]] AUG (méthionine) et s'arrête au premier codon stop rencontré (UAA, UAG ou UGA). Plusieurs codons peuvent désigner le même acide aminé.",
      "L'information portée par l'ARNm est ainsi convertie, grâce au code, en une séquence d'acides aminés qui détermine la forme et la fonction de la protéine. Il ne faut pas confondre l'information (la séquence des nucléotides, propre à chaque gène) **et le code** (la règle de correspondance, la même pour tous les gènes). Une mutation qui modifie un codon peut donc modifier un acide aminé, et ainsi la protéine produite.",
      {table: {legende: "Du gène à la protéine", entetes: ["Étape", "Lieu", "Molécule lue", "Molécule produite"],
       lignes: [["Transcription", "Noyau", "Brin transcrit de l'ADN du gène", "Pré-ARNm"], ["Maturation", "Noyau", "Pré-ARNm", "ARNm, exporté par les pores nucléaires"], ["Traduction", "Cytoplasme (ribosomes)", "ARNm, codon par codon", "Protéine (chaîne d'acides aminés)"]]}},
      "Le [[phénotype]] est l'ensemble des caractères d'un individu. Il s'observe à trois échelles : moléculaire, cellulaire et de l'organisme. Il dépend du **[[génotype]]**, c'est-à-dire des allèles que porte l'individu.",
      "Deux allèles d'un même gène diffèrent par quelques nucléotides. Si cette différence modifie des codons, la séquence d'acides aminés de la protéine change : la protéine peut alors fonctionner différemment (échelle moléculaire), ce qui modifie le fonctionnement des cellules (échelle cellulaire), puis les caractères de l'individu (échelle de l'organisme). Le phénotype dépend donc du génotype et de l'expression des gènes.",
      {aside: "Pour aller plus loin", texte: "Les vaccins à ARN messager contre la Covid-19 utilisent la traduction : ils contiennent un ARNm artificiel qui, une fois entré dans nos cellules, est traduit par nos ribosomes en une protéine du virus. Cette protéine, sans danger à elle seule, déclenche une réaction immunitaire. L'ARNm n'entre pas dans le noyau et il est rapidement dégradé."}
     ]},
     {titre: "L'expression des gènes est régulée", blocs: [
      "Toutes les cellules d'un organisme sont issues de la cellule-œuf par mitoses : elles possèdent le même patrimoine génétique. Pourtant, elles n'ont ni la même forme ni la même fonction. Un gène est exprimé lorsqu'il est transcrit en ARN puis, s'il s'agit d'un ARNm, traduit en protéine : c'est l'**[[expression d'un gène]]**.",
      "Des cellules possédant les mêmes gènes peuvent en exprimer des ensembles différents. Elles produisent ainsi des ARN et des protéines différents, ce qui contribue à leur spécialisation. Un gène peut donc être présent dans toutes les cellules, mais n'être transcrit que dans certaines d'entre elles : seules ces cellules contiennent son ARNm et fabriquent la protéine correspondante.",
      "L'expression des gènes est contrôlée par des facteurs internes à l'organisme, notamment au cours du développement, et par des facteurs externes, liés aux conditions de l'environnement. Elle peut donc varier au cours du temps. C'est la [[régulation de l'expression des gènes]]. L'étape intermédiaire de l'ARN permet ces régulations : à partir d'un même gène, une cellule peut produire beaucoup, peu ou pas d'ARNm. Le phénotype d'une cellule dépend donc à la fois de son génotype et de l'expression de ses gènes."
     ]},

/* ---------- Glossaire ---------- */
function norm(s){
  s = String(s).toLowerCase().replace(/\([^)]*\)/g, '').replace(/[’']/g, "'").trim().replace(/\s+/g, ' ');
  try { s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch(e){}
  return s;
}
/* Éléments masqués (cache: true, ou "cache" en fin de flashcard) */
/* des: "2026-11-05T18:00:00+01:00" (ou "des:..." en 3e élément d'une flashcard) : élément affiché seulement à partir de cette date */
function pasEncore(d){ try { return !!d && new Date() < new Date(d); } catch(err){ return false; } }
function visible(x){
  if (!x) return true;
  if (Array.isArray(x)) return !(x[2] === 'cache' || (typeof x[2] === 'string' && x[2].indexOf('des:') === 0 && pasEncore(x[2].slice(4))));
  return !(x.cache === true || pasEncore(x.des));
}
function recapText(r){ return Array.isArray(r) ? r.filter(visible).map(function(b){ return b.texte; }).join(' ') : (r || ''); }

var GLOSS = {};
function addPart(k, x){ var g = GLOSS[k]; if (g && !g.parts.some(function(p){ return p.p === x.p; })) g.parts.push(x); }
NIVEAUX.forEach(function(n){ allParties(n).forEach(function(x){ x.p.flashcards.filter(visible).forEach(function(c){ var k = norm(c[0]); if (!GLOSS[k]) GLOSS[k] = {t: c[0], d: c[1], parts: []}; addPart(k, x); }); }); });
Object.keys(GLOSSAIRE).forEach(function(k){ if (!GLOSS[norm(k)]) GLOSS[norm(k)] = {t: k.charAt(0).toUpperCase() + k.slice(1), d: GLOSSAIRE[k], parts: []}; });

}); });
/* Le glossaire ne garde que les mots utilisés dans les parties visibles */
Object.keys(GLOSS).forEach(function(k){ if (!GLOSS[k].parts.length) delete GLOSS[k]; });

/* Mise en forme : **gras**, *italique*, [[terme]] */
function rich(s){
  return String(s)
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function(_, txt, key){
      var k = norm(key || txt);
      if (!GLOSS[k]){ if (window.console) console.warn('Terme sans définition : ' + (key || txt)); return txt; }

    })

    .replace(/« /g, '« ').replace(/ ([»:;?!])/g, ' $1');
}

  var rects = el.getClientRects(), r = rects.length ? rects[0] : el.getBoundingClientRect();
  var left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, vw - w - 12));
  var sx = window.pageXOffset, sy = window.pageYOffset;
  tipEl.classList.remove('above');
  tipEl.style.left = (left + sx) + 'px';

  var th = tipEl.offsetHeight;
  if (r.bottom + th + 20 > window.innerHeight && r.top - th - 20 > 60){ tipEl.style.top = (r.top + sy - th - 10) + 'px'; tipEl.classList.add('above'); }
  tipEl.querySelector('.arrow').style.left = Math.max(10, Math.min(r.left + r.width / 2 - left - 6, w - 22)) + 'px';

  var h = '', LBL = {revision: 'Tout réviser', glossaire: 'Glossaire', tuto: 'Tuto', methodes: 'Méthodes', cartes: 'Classeur de cartes'};
  if (S.view !== 'home' && S.niveau) h += '<span>/</span><button data-go="home">' + esc(S.niveau.nom) + '</button>';
  if (S.view === 'partie') h += '<span>/</span><span class="cur">' + esc(S.partie.id) + ' · ' + esc(S.partie.titre) + '</span>';
  if (LBL[S.view]) h += '<span>/</span><span class="cur">' + LBL[S.view] + '</span>';
  if (S.view === 'methode') h += '<span>/</span><button data-go="methodes">Méthodes</button>';
  $('glBtn').classList.toggle('on', S.view === 'glossaire');
  $('tutoBtn').classList.toggle('on', S.view === 'tuto');
  var home = S.view === 'home';
  $('backBtn').classList.toggle('show', !home);
  $('homeBtn').classList.toggle('show', !home);
  $('brand').classList.toggle('hide', !home);
  crumbsEl.innerHTML = h;
  crumbsEl.querySelectorAll('[data-go]').forEach(function(b){ b.onclick = function(){ go(b.dataset.go); }; });
}
function goHome(){ if (NIVEAUX.length > 1) S.niveau = null; go('home'); }
$('brand').onclick = goHome;
$('homeBtn').onclick = goHome;

/* Historique : le bouton « Retour » et le bouton retour du navigateur
   ramènent à la page précédente du site */
/* Dans une page intégrée (Google Sites), l'historique du navigateur n'est pas
   fiable : le bouton « Retour » utilise alors uniquement la pile interne. */
var EMBED = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();
var HIST = [], USE_HISTORY = !EMBED;
function snap(){ return {view: S.view, niveau: S.niveau, chap: S.chap, partie: S.partie, tab: S.tab, methode: S.methode}; }
function restore(){
  var s = HIST.pop();
  if (s){ S.view = s.view; S.niveau = s.niveau; S.chap = s.chap; S.partie = s.partie; S.tab = s.tab; S.methode = s.methode; } else S.view = 'home';
  render(); toTop();
}
function goBack(){
  if (!HIST.length){ goHome(); return; }
  if (USE_HISTORY){ try { history.back(); return; } catch(e){} }
  restore();
}
$('backBtn').onclick = goBack;
window.addEventListener('popstate', function(e){
  if (!USE_HISTORY) return;
  var n = (e.state && e.state.svt) || 0;
  if (n >= HIST.length) return;            /* bouton « suivant » du navigateur : rien à restaurer */
  while (HIST.length > n + 1) HIST.pop();
  restore();
});

function go(view, opts){
  opts = opts || {};
  if (!opts.noPush){
    HIST.push(snap());
    if (USE_HISTORY){ try { history.pushState({svt: HIST.length}, ''); } catch(e){ USE_HISTORY = false; } }
  }
  S.view = view;
  if (opts.partie){ S.partie = opts.partie; S.chap = opts.ch; }
  if (opts.tab) S.tab = opts.tab;
  if (opts.methode) S.methode = opts.methode;
  render(); toTop();
}
/* Fondu doux quand on passe de la nuit de l'accueil au violet des pages (et inversement) */
function fondu(c){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var o = document.createElement('div'); o.className = 'nl-fondu'; o.style.background = c;
  document.body.appendChild(o);
  void o.offsetWidth; o.style.opacity = '0';
  setTimeout(function(){ if (o.parentNode) o.parentNode.removeChild(o); }, 1000);
}
function render(){
  setKeys(null); hideTip(); closeLb(); closeViewer(); if (typeof ctFermer === 'function') ctFermer();
  var hr = document.documentElement, avant = hr.classList.contains('nl-nuit'), coulAvant = avant ? '#3a2c5e' : getComputedStyle(hr).getPropertyValue('--paper');
  hr.classList.toggle('nl-home', S.view === 'home'); applyReg();
  if (avant !== hr.classList.contains('nl-nuit')) fondu(coulAvant);
  if (!S.niveau && NIVEAUX.length === 1) S.niveau = NIVEAUX[0];
  document.body.style.cssText = S.view === 'partie' ? colorVars(chapColor(S.chap)) : (S.view === 'home' ? '' : colorVars(S.view === 'methodes' || S.view === 'methode' || S.view === 'cartes' ? METH_COUL : neutre()));
  renderCrumbs();
  if (S.view === 'partie') renderPartie();
  else if (S.view === 'revision') renderRevision();
  else if (S.view === 'glossaire') renderGlossaire();
  else if (S.view === 'tuto') renderTuto();
  else if (S.view === 'methodes') renderMethodes();
  else if (S.view === 'methode') renderMethode();
  else if (S.view === 'cartes' && CT_ACTIF) renderCartes();
  else if (!S.niveau) renderNiveaux();
  else renderNiveau();
}

/* ================================================================
   Classeur de cartes : dessins (SVG générés, aucune image)
   ================================================================ */
function ctRng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function f1(x){ return Math.round(x * 10) / 10; }
function sk(c, w, x){ return ' stroke="' + c + '" stroke-width="' + (w || 1.5) + '" stroke-linecap="round" stroke-linejoin="round"' + (x || ''); }
function svP(d, f, x){ return '<path d="' + d + '" fill="' + (f || 'none') + '"' + (x || '') + '/>'; }
function svC(cx, cy, r, f, x){ return '<circle cx="' + f1(cx) + '" cy="' + f1(cy) + '" r="' + f1(r) + '" fill="' + (f || 'none') + '"' + (x || '') + '/>'; }
function svE(cx, cy, rx, ry, f, x){ return '<ellipse cx="' + f1(cx) + '" cy="' + f1(cy) + '" rx="' + f1(rx) + '" ry="' + f1(ry) + '" fill="' + (f || 'none') + '"' + (x || '') + '/>'; }
function svR(x, y, w, h, r, f, xx){ return '<rect x="' + f1(x) + '" y="' + f1(y) + '" width="' + f1(w) + '" height="' + f1(h) + '" rx="' + (r || 0) + '" fill="' + (f || 'none') + '"' + (xx || '') + '/>'; }
function ctL(x1, y1, x2, y2, c, w, x){ return '<line x1="' + f1(x1) + '" y1="' + f1(y1) + '" x2="' + f1(x2) + '" y2="' + f1(y2) + '"' + sk(c, w, x) + '/>'; }
function ctT(x, y, s, size, f, x2){ return '<text x="' + f1(x) + '" y="' + f1(y) + '" font-size="' + size + '" fill="' + f + '" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle"' + (x2 || '') + '>' + s + '</text>'; }
function svG(tr, inner){ return '<g transform="' + tr + '">' + inner + '</g>'; }
function ombre(cx, cy, rx){ return svE(cx, cy, rx, rx * .13, 'rgba(0,0,0,.16)'); }
function fleche(x1, y1, x2, y2, c, w){
  var a = Math.atan2(y2 - y1, x2 - x1), k = 4 + (w || 2);
  return ctL(x1, y1, x2, y2, c, w || 2) + svP('M' + f1(x2) + ' ' + f1(y2) + 'L' + f1(x2 - k * Math.cos(a - .5)) + ' ' + f1(y2 - k * Math.sin(a - .5)) + 'L' + f1(x2 - k * Math.cos(a + .5)) + ' ' + f1(y2 - k * Math.sin(a + .5)) + 'Z', c);
}

/* ---------- Formes de base ---------- */
function blobPath(cx, cy, rx, ry, rnd, n, j){
  n = n || 10; j = j === undefined ? .3 : j;
  var pts = [];
  for (var i = 0; i < n; i++){ var a = i / n * Math.PI * 2, k = 1 - j / 2 + rnd() * j; pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
  var m = function(a, b){ return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
  var s = m(pts[n - 1], pts[0]), d = 'M' + f1(s[0]) + ' ' + f1(s[1]);
  for (var q = 0; q < n; q++){ var e = m(pts[q], pts[(q + 1) % n]); d += 'Q' + f1(pts[q][0]) + ' ' + f1(pts[q][1]) + ' ' + f1(e[0]) + ' ' + f1(e[1]); }
  return d + 'Z';
}
function speck(rnd, n, cols, s, box, op){
  box = box || [14, 12, 92, 62]; var h = '';
  for (var i = 0; i < n; i++){
    var x = box[0] + rnd() * box[2], y = box[1] + rnd() * box[3], k = s * (.55 + rnd() * .9), c = cols[Math.floor(rnd() * cols.length)], v = 4 + Math.floor(rnd() * 3), d = '';
    for (var j = 0; j < v; j++){ var a = j / v * 6.283 + rnd() * .7; d += (j ? 'L' : 'M') + f1(x + Math.cos(a) * k) + ' ' + f1(y + Math.sin(a) * k * .85); }
    h += svP(d + 'Z', c, op ? ' opacity="' + op + '"' : '');
  }
  return h;
}
function laths(rnd, n, cols, len, w, box){
  box = box || [14, 12, 92, 62]; var h = '';
  for (var i = 0; i < n; i++){
    var x = box[0] + rnd() * box[2], y = box[1] + rnd() * box[3], l = len * (.5 + rnd() * .8), a = Math.floor(rnd() * 180);
    h += svR(x - l / 2, y - w / 2, l, w, w / 3, cols[Math.floor(rnd() * cols.length)], ' transform="rotate(' + a + ' ' + f1(x) + ' ' + f1(y) + ')"');
  }
  return h;
}
/* Roche posée, avec texture découpée dans sa forme */
function roche(no, base, tex, rx, ry){
  var rnd = ctRng(no * 7919 + 13), d = blobPath(60, 44, rx || 42, ry || 29, rnd, 11, .28), id = 'ck' + no;
  return ombre(60, 75, 40) + '<clipPath id="' + id + '"><path d="' + d + '"/></clipPath>' + svP(d, base)
    + '<g clip-path="url(#' + id + ')">' + tex(ctRng(no * 31 + 5)) + svP('M0 0H120V30Q80 18 50 24T0 34Z', 'rgba(255,255,255,.16)') + svP('M0 84H120V60Q80 72 40 66T0 62Z', 'rgba(0,0,0,.14)') + '</g>'
    + svP(d, 'none', sk('rgba(0,0,0,.4)', 1.3));
}
/* Chromosome à deux chromatides (X) ou à une chromatide */
function chromo(cx, cy, h, col, ang, simple, w){
  w = w || h * .24;
  var b = function(r){ return svR(cx - w / 2, cy - h / 2, w, h, w / 2, col, ' transform="rotate(' + r + ' ' + f1(cx) + ' ' + f1(cy) + ')"' + sk('rgba(0,0,0,.25)', .8)); };
  var s = simple ? b(ang || 0) : b((ang || 0) - 16) + b((ang || 0) + 16);
  return s + (simple ? '' : svC(cx, cy, w * .42, 'rgba(255,255,255,.75)'));
}
/* Double hélice d'ADN horizontale */
function helice(x0, y0, len, amp, tours, c1, c2, cols, x){
  var n = 60, d1 = '', d2 = '', rungs = '', k = tours * Math.PI * 2;
  for (var i = 0; i <= n; i++){
    var t = i / n, xx = x0 + t * len, s = Math.sin(t * k);
    d1 += (i ? 'L' : 'M') + f1(xx) + ' ' + f1(y0 + s * amp);
    d2 += (i ? 'L' : 'M') + f1(xx) + ' ' + f1(y0 - s * amp);
  }
  var nb = Math.round(tours * 8);
  for (var r = 0; r < nb; r++){
    var tr = (r + .5) / nb, xr = x0 + tr * len, sr = Math.sin(tr * k) * amp;
    if (Math.abs(sr) < amp * .18) continue;
    var cc = cols[r % cols.length];
    rungs += ctL(xr, y0 + sr, xr, y0, cc[0], 2.6) + ctL(xr, y0, xr, y0 - sr, cc[1], 2.6);
  }
  return rungs + svP(d2, 'none', sk(c2, 3.2)) + svP(d1, 'none', sk(c1, 3.2)) + (x || '');
}
var BASES = [['#e8505b', '#3aa1d8'], ['#3aa1d8', '#e8505b'], ['#f2b83b', '#4fb06d'], ['#4fb06d', '#f2b83b']];
function sequence(x, y, lettres, hl, w){
  w = w || 14; var h = '', col = {A: '#e8505b', T: '#3aa1d8', U: '#9b6bd6', G: '#f2b83b', C: '#4fb06d'};
  for (var i = 0; i < lettres.length; i++){
    var L = lettres[i], xx = x + i * (w + 2);
    if (L === ' '){ h += svR(xx, y, w, w + 4, 3, 'none', sk('#8a8a8a', 1, ' stroke-dasharray="2 2"')); continue; }
    h += svR(xx, y, w, w + 4, 3, col[L] || '#999', hl && hl.indexOf(i) >= 0 ? sk('#111', 2) : '') + ctT(xx + w / 2, y + w / 2 + 6, L, w * .72, '#fff');
  }
  return h;
}
function cellule(cx, cy, rx, ry, fond, noyau){
  return svE(cx, cy, rx, ry, fond, sk('rgba(0,0,0,.3)', 1.4)) + (noyau ? svE(cx, cy, rx * .38, ry * .38, noyau, sk('rgba(0,0,0,.25)', 1)) : '');
}
function etoile(cx, cy, r, f, x){
  var d = '';
  for (var i = 0; i < 10; i++){ var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; d += (i ? 'L' : 'M') + f1(cx + Math.cos(a) * rr) + ' ' + f1(cy + Math.sin(a) * rr); }
  return svP(d + 'Z', f, x);
}
function vague(x0, y0, len, amp, per, c, w){
  var d = ''; for (var i = 0; i <= 60; i++){ var t = i / 60; d += (i ? 'L' : 'M') + f1(x0 + t * len) + ' ' + f1(y0 + Math.sin(t * Math.PI * 2 * per) * amp); }
  return svP(d, 'none', sk(c, w || 2));
}
function couches(y, list){ /* list : [[hauteur, couleur]] du haut vers le bas */
  var h = '', yy = y;
  list.forEach(function(c){ h += svR(0, yy, 120, c[0], 0, c[1]); yy += c[0]; });
  return h;
}
function enzyme(cx, cy, r, col, ang){
  /* « pac-man » : protéine globulaire avec site actif en creux */
  var a = (ang || 0) * Math.PI / 180, a1 = a - .5, a2 = a + .5;
  var d = 'M' + f1(cx + Math.cos(a1) * r) + ' ' + f1(cy + Math.sin(a1) * r)
    + 'A' + r + ' ' + r + ' 0 1 0 ' + f1(cx + Math.cos(a2) * r) + ' ' + f1(cy + Math.sin(a2) * r)
    + 'Q' + f1(cx + Math.cos(a) * r * .25) + ' ' + f1(cy + Math.sin(a) * r * .25) + ' ' + f1(cx + Math.cos(a1) * r) + ' ' + f1(cy + Math.sin(a1) * r) + 'Z';
  return svP(d, col, sk('rgba(0,0,0,.3)', 1.4)) + svP('M' + f1(cx - r * .55) + ' ' + f1(cy - r * .4) + 'q' + f1(r * .3) + ' -' + f1(r * .3) + ' ' + f1(r * .6) + ' -' + f1(r * .2), 'none', sk('rgba(255,255,255,.5)', 2));
}
function perles(pts, cols, r){
  var h = '', d = '';
  pts.forEach(function(p, i){ d += (i ? 'L' : 'M') + p[0] + ' ' + p[1]; });
  h += svP(d, 'none', sk('rgba(0,0,0,.35)', 1.6));
  pts.forEach(function(p, i){ h += svC(p[0], p[1], r || 4.5, cols[i % cols.length], sk('rgba(0,0,0,.3)', .8)); });
  return h;
}
function cristalPrisme(cx, by, w, h, pt, f1c, f2c, f3c){
  /* prisme hexagonal vu de 3/4, avec pyramide */
  var x0 = cx - w / 2, x1 = cx - w / 6, x2 = cx + w / 6, x3 = cx + w / 2, ty = by - h;
  return svP('M' + x0 + ' ' + by + 'L' + x0 + ' ' + ty + 'L' + x1 + ' ' + (ty + 3) + 'L' + x1 + ' ' + (by + 3) + 'Z', f1c)
    + svP('M' + x1 + ' ' + (by + 3) + 'L' + x1 + ' ' + (ty + 3) + 'L' + x2 + ' ' + (ty + 3) + 'L' + x2 + ' ' + (by + 3) + 'Z', f2c)
    + svP('M' + x2 + ' ' + (by + 3) + 'L' + x2 + ' ' + (ty + 3) + 'L' + x3 + ' ' + ty + 'L' + x3 + ' ' + by + 'Z', f3c)
    + svP('M' + x0 + ' ' + ty + 'L' + cx + ' ' + (ty - pt) + 'L' + x1 + ' ' + (ty + 3) + 'Z', f2c)
    + svP('M' + x1 + ' ' + (ty + 3) + 'L' + cx + ' ' + (ty - pt) + 'L' + x2 + ' ' + (ty + 3) + 'Z', f1c)
    + svP('M' + x2 + ' ' + (ty + 3) + 'L' + cx + ' ' + (ty - pt) + 'L' + x3 + ' ' + ty + 'Z', f3c)
    + svP('M' + x0 + ' ' + by + 'L' + x0 + ' ' + ty + 'L' + cx + ' ' + (ty - pt) + 'L' + x3 + ' ' + ty + 'L' + x3 + ' ' + by + 'L' + x2 + ' ' + (by + 3) + 'L' + x1 + ' ' + (by + 3) + 'Z', 'none', sk('rgba(0,0,0,.35)', 1));
}
function bloc3d(x, y, w, h, d, top, front, side){
  return svP('M' + x + ' ' + y + 'l' + d + ' -' + d * .6 + 'h' + w + 'l-' + d + ' ' + d * .6 + 'Z', top)
    + svP('M' + (x + w) + ' ' + y + 'l' + d + ' -' + d * .6 + 'v' + h + 'l-' + d + ' ' + d * .6 + 'Z', side)
    + svR(x, y, w, h, 0, front) + svP('M' + x + ' ' + y + 'l' + d + ' -' + d * .6 + 'h' + w + 'v' + h + 'l-' + d + ' ' + d * .6 + 'h-' + w + 'Z', 'none', sk('rgba(0,0,0,.35)', 1));

/* ---------- Tirage d'un booster ---------- */
function ctTirage(){
  var pool = ctPool(), par = {C: [], R: [], E: [], L: []}, ordre = ['L', 'E', 'R', 'C'], out = [], deja = {};
  pool.forEach(function(c){ par[c[2]].push(c); });
  for (var i = 0; i < 5; i++){
    var x = Math.random(), ra = i < 4 ? (x < .015 ? 'L' : x < .09 ? 'E' : x < .34 ? 'R' : 'C') : (x < .05 ? 'L' : x < .28 ? 'E' : 'R');
    var k = ordre.indexOf(ra); while (k < 3 && !par[ordre[k]].length) k++;
    var lst = par[ordre[k]].length ? par[ordre[k]] : pool, c = null;
    for (var t = 0; t < 4; t++){ c = lst[Math.floor(Math.random() * lst.length)]; if (!deja[c[0]]) break; }
    deja[c[0]] = 1;
    out.push({c: c, shiny: Math.random() < .05});
  }
  out.sort(function(a, b){ return CT_RAR[a.c[2]][1] - CT_RAR[b.c[2]][1]; });
  return out;
}

/* ---------- Code de sauvegarde (cartes obtenues et shiny, sans les doublons) ---------- */
function ctCode(s){
  var n = 0, bits = [], out = '', sum = 0;
  CARTES.forEach(function(c){ if (c[0] > n) n = c[0]; });
  for (var i = 1; i <= n; i++){ var e = s.c[i]; bits.push(e && e[0] ? 1 : 0, e && e[1] ? 1 : 0); }
  while (bits.length % 5) bits.push(0);
  for (var j = 0; j < bits.length; j += 5){ var v = 0; for (var k = 0; k < 5; k++) v = v * 2 + bits[j + k]; out += CT_ALPH[v]; }
  for (var q = 0; q < out.length; q++) sum = (sum + (CT_ALPH.indexOf(out[q]) + 1) * (q + 7)) % 1024;
  out = CT_ALPH[sum >> 5] + CT_ALPH[sum & 31] + out;
  return out.replace(/(.{5})/g, '$1-').replace(/-$/, '');
}
function ctDecode(code){
  var x = String(code || '').toUpperCase().replace(/[\s-]/g, ''), sum = 0, res = {};
  if (x.length < 4) return null;
  var ck = x.slice(0, 2), body = x.slice(2);
  for (var q = 0; q < body.length; q++){ var ix = CT_ALPH.indexOf(body[q]); if (ix < 0) return null; sum = (sum + (ix + 1) * (q + 7)) % 1024; }
  if (CT_ALPH[sum >> 5] + CT_ALPH[sum & 31] !== ck) return null;
  var bits = [];
  for (var i = 0; i < body.length; i++){ var v = CT_ALPH.indexOf(body[i]); for (var k = 4; k >= 0; k--) bits.push((v >> k) & 1); }
  for (var no = 1; no * 2 <= bits.length; no++){ if (bits[(no - 1) * 2]) res[no] = [1, bits[(no - 1) * 2 + 1]]; }
  return res;
}

var ctOv = null;

function ctTilt(el){
  /* reflet et inclinaison seulement sur la carte affichée en grand */
  var card = el.querySelector('.cc'); if (!card) return;
  el.addEventListener('pointermove', function(e){
    var r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;

    card.style.setProperty('--hx', f1(x * 100) + '%'); card.style.setProperty('--hy', f1(y * 100) + '%');

}

/* ---------- Glossaire avec recherche tolérante aux fautes ---------- */
function lev(a, b, max){
  if (Math.abs(a.length - b.length) > max) return max + 1;
  var prev = [], cur, i, j;
  for (j = 0; j <= b.length; j++) prev[j] = j;
  for (i = 1; i <= a.length; i++){
    cur = [i]; var best = i;
    for (j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function tol(s){ return s.length <= 3 ? 0 : s.length <= 5 ? 1 : s.length <= 8 ? 2 : 3; }
var GLIST = null;
function glossList(){
  if (GLIST) return GLIST;
  GLIST = Object.keys(GLOSS).map(function(k){
    var g = GLOSS[k], dn = norm(g.d);
    return {k: k, g: g, words: k.split(/[^a-z0-9]+/).filter(Boolean), dn: dn, dwords: dn.split(/[^a-z0-9]+/).filter(function(w){ return w.length >= 4; })};
  }).sort(function(a, b){ return a.k < b.k ? -1 : 1; });
  return GLIST;
}
function searchGloss(q){
  var qn = norm(q), toks = qn.split(/[^a-z0-9]+/).filter(function(t){ return t.length >= 2; });
  var toks4 = toks.filter(function(t){ return t.length >= 4; });

  return '<svg viewBox="0 0 120 80" aria-hidden="true"><path d="M4 4V76H116" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="14" y="36" width="18" height="40" fill="currentColor"/><rect x="40" y="14" width="18" height="62" fill="currentColor"/><rect x="66" y="50" width="18" height="26" fill="currentColor"/><rect x="92" y="26" width="18" height="50" fill="currentColor"/></svg>';
}
function renderGraphFiche(m){
  var C = GF_COUL;
  function num(n, c){ return '<span class="gf-n" style="background:' + c + '">' + n + '</span>'; }
  var h = '<div class="view mf gf"><header class="gf-head"><span class="fr-tag">' + esc(m.etape) + '</span><h1>Fiche méthode : Le graphique</h1>'
    + '<div class="gf-niv"><span style="--n:' + C.s + '">Seconde</span><span style="--n:' + C.p + '">Première</span><span style="--n:' + C.t + '">Terminale</span></div>'
    + '<p class="gf-lead">On utilise un <b>graphique</b> pour <u>présenter des résultats chiffrés</u> et répondre au problème posé : une <b>courbe</b> montre comment une mesure évolue en fonction d\'un facteur (temps, température…), un <b>histogramme</b> compare des valeurs entre plusieurs catégories (espèces, sols…).</p></header>';
  var crit = [['s', 'Des axes orientés, gradués régulièrement, avec une grandeur et une unité.'], ['s', 'Un titre, une légende et les conditions de l\'expérience.'], ['p', 'Des informations ajoutées qui expliquent le graphique.'], ['t', 'Je choisis moi-même le type de graphique adapté.'], ['t', 'Le graphique montre clairement ce qui répond au problème.']];
  h += '<ol class="gf-crit">' + crit.map(function(c, i){ return '<li style="--n:' + C[c[0]] + ';--nx:' + (crit[i + 1] ? C[crit[i + 1][0]] : 'transparent') + '"><span>' + (i + 1) + '.</span> ' + esc(c[1]) + '</li>'; }).join('') + '</ol>';
  h += '<div class="gf-duo">'
    + '<section class="gf-box" style="--n:' + C.s + '"><h2>' + num(1, C.s) + 'Quel axe pour quoi ?</h2><p><b>Abscisse</b> (axe horizontal) : ce que je fais varier.</p><p><b>Ordonnée</b> (axe vertical) : la valeur que je mesure.</p></section>'
    + '<section class="gf-box" style="--n:' + C.s + '"><h2>' + num(2, C.s) + 'Le titre</h2><p>Évolution de <b>[ce que je mesure, en ordonnée]</b> en fonction de <b>[ce que je fais varier, en abscisse]</b></p></section></div>';
  h += '<figure class="gf-fig"><img src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(gfSvg()) + '" alt="Exemple de graphique annoté : évolution de la concentration en dioxygène en fonction du temps, avec et sans chlorelles, à la lumière puis à l\'obscurité. Les repères 1 à 5 correspondent aux critères." data-zoom tabindex="0" role="button"><figcaption>Touche le graphique pour l\'agrandir.</figcaption></figure>';
  h += '<section class="gf-box gf-4" style="--n:' + C.t + '"><h2>' + num(4, C.t) + 'Courbe ou histogramme ?</h2><div class="gf-types">'
    + '<div>' + gfMini('courbe') + '<div><h3>Courbe</h3><p>La valeur mesurée varie en continu (temps, température, concentration…)</p></div></div>'
    + '<div>' + gfMini('histo') + '<div><h3>Histogramme</h3><p>Je compare des catégories séparées (espèces, sols, organes, groupes…)</p></div></div></div></section>';
  return h;
}
function renderMethode(){
  var list = METHODES.filter(visible), m = null, idx = -1;
  list.forEach(function(x, i){ if (x.id === S.methode){ m = x; idx = i; } });
  if (!m){ renderMethodes(); return; }
  document.body.style.cssText = colorVars(m.couleur || METH_COUL);
  if (m.special === 'graphique'){
    var nx0 = list[idx + 1];
    app.innerHTML = renderGraphFiche(m) + '<nav class="mf-nav"><button class="btn" id="mList">← Toutes les fiches</button>' + (nx0 ? '<button class="btn" id="mNext">' + esc(nx0.titre) + ' →</button>' : '') + '</nav></div>';
    $('mList').onclick = function(){ go('methodes'); };
    if (nx0) $('mNext').onclick = function(){ go('methode', {methode: nx0.id}); };
    return;
  }
  function card(cls, titre, inner){ return '<section class="mf-card' + (cls ? ' ' + cls : '') + '">' + (titre ? '<h2>' + esc(titre) + '</h2>' : '') + inner + '</section>'; }
  var vis = card('mf-vis', '', MV[m.visuel] ? MV[m.visuel](m) : '');
  var steps = m.etapes.length ? card('', 'Les étapes', '<ol class="tl">' + m.etapes.map(function(e, i){
    return '<li><span class="tl-n">' + (i + 1) + '</span><div><h3>' + esc(e.t) + (e.n ? '<span class="tl-ref">' + e.n.map(function(k){ return mnum(k); }).join('') + '</span>' : '') + '</h3>' + (e.x ? '<p>' + mfmt(e.x) + '</p>' : '') + '</div></li>';
  }).join('') + '</ol>') : '';
  var x = m.exemple, ex = x ? card('mf-ex', x.titre || 'Exemple rédigé', '<p class="q">' + mfmt(x.consigne) + '</p>' + (x.tableau ? tableHtml(x.tableau) : '') + '<div class="rep">' + x.reponse.map(function(r){ return '<p>' + mfmt(r) + '</p>'; }).join('') + '</div>') : '';
  var a = m.atoi, toi = a ? card('mf-try', 'À toi', '<p class="try-doc">' + mfmt(a.consigne) + '</p><p class="q">' + mfmt(a.question) + '</p><div class="try-f"><button type="button" class="btn" data-try>Voir la correction</button><div class="fold"><div><div class="try-c">' + a.correction.map(function(c){ return '<p>' + mfmt(c) + '</p>'; }).join('') + '</div></div></div></div>') : '';
  var ver = m.verif ? card('', 'Je vérifie', '<ul class="chk">' + m.verif.map(function(v){ return '<li><button type="button" class="chk-b" aria-pressed="false"><span class="box" aria-hidden="true"></span><span>' + mfmt(v) + '</span></button></li>'; }).join('') + '</ul>') : '';
  var r = m.retenir, ret = r ? card('mf-ret', r.titre, r.cartes ? '<div class="rp">' + r.cartes.map(function(l){ return '<div><span class="fr-tag">' + esc(l[0]) + '</span><span class="d">' + mfmt(l[1]) + '</span></div>'; }).join('') + '</div>' : r.lignes.map(function(l){ return '<p>' + mfmt(l) + '</p>'; }).join('')) : '';
  var h = '<div class="view mf"><header class="mf-head"><span class="fr-tag">' + esc(m.etape) + '</span><h1>' + esc(m.titre) + '</h1><p class="mf-lead">' + mfmt(m.bref) + '</p></header>';
  /* Mise en page : le visuel (seul, ou à côté des étapes), puis les autres cartes deux par deux */
  var rest;
  if (m.large || !steps){ h += '<div class="mf-row">' + vis + '</div>'; rest = [steps, ex, toi, ver, ret]; }
  else { h += '<div class="mf-row two">' + vis + steps + '</div>'; rest = [ex, toi, ver, ret]; }
  rest = rest.filter(function(y){ return y; });
  for (var ri = 0; ri < rest.length; ri += 2) h += '<div class="mf-row' + (rest[ri + 1] ? ' half' : '') + '">' + rest[ri] + (rest[ri + 1] || '') + '</div>';
  var nx = list[idx + 1];
  h += '<nav class="mf-nav"><button class="btn" id="mList">← Toutes les fiches</button>' + (nx ? '<button class="btn" id="mNext">' + esc(nx.titre) + ' →</button>' : '') + '</nav></div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-try]').forEach(function(b){ b.onclick = function(){ var o = b.parentNode.classList.toggle('open'); b.textContent = o ? 'Masquer la correction' : 'Voir la correction'; }; });
  app.querySelectorAll('.chk-b').forEach(function(b){ b.onclick = function(){ var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on ? 'true' : 'false'); }; });
  app.querySelectorAll('[data-goto]').forEach(function(b){ b.onclick = function(){ go('methode', {methode: b.dataset.goto}); }; });
  $('mList').onclick = function(){ go('methodes'); };
  if (nx) $('mNext').onclick = function(){ go('methode', {methode: nx.id}); };
}

/* ---------- Réglages de lecture ---------- */
/* Par défaut : taille normale, police Lexend, espacement normal, thème bleu */
var REG = {taille: 1, police: 'lex', espace: 'n', theme: 'bleu'};
try { var r0 = JSON.parse(localStorage.getItem('svt_reglages_v3')); if (r0) for (var k0 in r0) REG[k0] = r0[k0]; } catch(e){}
var TAILLES = ['93.75%', '100%', '112.5%', '125%'];
function applyReg(){
  var r = document.documentElement;
  r.style.fontSize = TAILLES[REG.taille] || '100%';
  r.classList.toggle('f-lex', REG.police === 'lex');
  r.classList.toggle('sp-wide', REG.espace === 'w');
  /* Pendant le mode Noël, le thème violet par défaut passe en version nuit */
  var nl = REG.theme === 'bleu' && typeof NOEL_NUIT !== 'undefined' && NOEL_NUIT, nuit = REG.theme === 'bleu' && nuitAccueil();
  r.classList.toggle('th-bleu', REG.theme === 'bleu' && !nuit);
  r.classList.toggle('th-clair', REG.theme === 'clair');
  r.classList.toggle('th-sombre', REG.theme === 'sombre' || nuit);
  r.classList.toggle('nl-nuit', nuit);
  try { localStorage.setItem('svt_reglages_v3', JSON.stringify(REG)); } catch(e){}
}
function pillRow(label, key, opts){
  var h = '<p class="set-label">' + label + '</p><div class="pills">';
  opts.forEach(function(o){ h += '<button data-set="' + key + '" data-val="' + o[0] + '" class="' + (String(REG[key]) === String(o[0]) ? 'on' : '') + '"' + (o[2] ? ' style="' + o[2] + '"' : '') + '>' + o[1] + '</button>'; });
  return h + '</div>';
}
function drawSettings(){
  var s = $('settings');
  s.innerHTML = pillRow('Thème', 'theme', [['bleu', 'Violet'], ['papier', 'Papier'], ['clair', 'Clair'], ['sombre', 'Sombre']])
    + pillRow('Taille du texte', 'taille', [[0, 'A−', 'font-size:.78rem'], [1, 'A', 'font-size:.86rem'], [2, 'A+', 'font-size:.96rem'], [3, 'A++', 'font-size:1.06rem']])
    + pillRow('Police', 'police', [['lex', 'Lexend'], ['std', 'Classique']])
    + pillRow('Espacement', 'espace', [['n', 'Normal'], ['w', 'Élargi']])
    + '<p class="note">Lexend est une police conçue pour faciliter la lecture. L\'espacement élargi ajoute de l\'espace entre les lettres, les mots et les lignes, et aligne le texte à gauche (utile en cas de dyslexie).</p>';
  s.querySelectorAll('[data-set]').forEach(function(b){
    b.onclick = function(){
      var key = b.dataset.set, v = b.dataset.val;
      REG[key] = key === 'taille' ? +v : v;
      applyReg();
      if (key === 'theme') render();
      drawSettings();
    };
  });
}
function toggleSettings(show){
  var s = $('settings'), on = show === undefined ? !s.classList.contains('show') : show;
  if (on) drawSettings();
  s.classList.toggle('show', on); $('setBtn').classList.toggle('on', on); $('setBtn').setAttribute('aria-expanded', on);
}
$('setBtn').onclick = function(e){ e.stopPropagation(); hideTip(); toggleSettings(); };
$('glBtn').onclick = function(){ toggleSettings(false); go('glossaire'); };
document.addEventListener('click', function(e){ if ($('settings').classList.contains('show') && !$('settings').contains(e.target)) toggleSettings(false); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') toggleSettings(false); });
applyReg();

/* ---------- Tout réviser ---------- */
function renderRevision(){
  var fc = [], q = [];
  allParties(S.niveau).forEach(function(x){
    var col = chapColor(x.ch);
    x.p.flashcards.filter(visible).forEach(function(c){ fc.push({t: c[0], d: c[1], col: col, tag: x.p.id}); });
    x.p.qcm.filter(visible).forEach(function(it){ q.push({q: it.q, o: it.o, r: it.r, e: it.e, n: it.n, col: col, tag: x.p.id}); });
  });
  var h = '<div class="view"><header class="hero"><p class="kicker">' + esc(S.niveau.nom) + '</p><h1>Tout réviser</h1><p class="probl"><span>Mode révision</span>Toutes les parties sont mélangées.</p></header></div>'
    + '<nav class="tabs" id="tabs"><button data-t="flashcards" class="' + (S.tab === 'flashcards' ? 'on' : '') + '">Flashcards</button><button data-t="qcm" class="' + (S.tab === 'qcm' ? 'on' : '') + '">QCM</button></nav><div id="tab"></div>';
  app.innerHTML = h;
  function draw(){ var tab = $('tab'); setKeys(null); if (S.tab === 'flashcards') renderFlashcards(tab, fc); else renderQcm(tab, q, 'qcm_tout_' + S.niveau.id); }
  app.querySelectorAll('#tabs button').forEach(function(b){ b.onclick = function(){ S.tab = b.dataset.t; app.querySelectorAll('#tabs button').forEach(function(x){ x.classList.toggle('on', x === b); }); draw(); }; });
  draw();
}

/* ---------- Flashcards ---------- */
function renderFlashcards(tab, cards){
  cards = cards.map(function(c){ return Array.isArray(c) ? {t: c[0], d: c[1]} : c; });
  var mode = 'jeu', sens = 'mot', deck, idx, known, review, dir = 1;
  function reset(list){ deck = shuffle(list || cards); idx = 0; known = 0; review = []; dir = 1; }
  reset();

  function faces(c, small){
    var term = '<div class="term-big">' + esc(c.t) + '</div>', def = '<div class="def">' + esc(c.d) + '</div>';
    var f = sens === 'mot' ? [term, def, 'Mot-clé', 'Définition'] : [def, term, 'Définition', 'Mot-clé'];
    var tag = c.tag ? '<span class="code">' + esc(c.tag) + '</span>' : '';
    return '<div class="face front"><span class="lab">' + f[2] + '</span>' + tag + f[0] + (small ? '' : '<span class="hint">Touche la carte pour la retourner</span>') + '</div>'
         + '<div class="face back"><span class="lab">' + f[3] + '</span>' + tag + f[1] + '</div>';
  }
  function cstyle(c){ return c.col ? ' style="' + colorVars(c.col) + '"' : ''; }

  function draw(){
    var h = '<div class="fc-tools"><div class="pills"><button data-m="jeu" class="' + (mode === 'jeu' ? 'on' : '') + '">Une par une</button><button data-m="liste" class="' + (mode === 'liste' ? 'on' : '') + '">Toutes</button></div>'
      + '<div class="pills"><button data-s="mot" class="' + (sens === 'mot' ? 'on' : '') + '">Mot d\'abord</button><button data-s="def" class="' + (sens === 'def' ? 'on' : '') + '">Définition d\'abord</button></div></div>';
    if (mode === 'liste'){
      h += '<div class="fc-grid">';
      cards.forEach(function(c){ h += '<div class="scene"' + cstyle(c) + '><div class="flash">' + faces(c, true) + '</div></div>'; });
      h += '</div>';
      setKeys(null);
    } else if (idx >= deck.length){
      h += '<div class="done"><div class="big">' + known + ' / ' + deck.length + '</div><p>cartes connues</p>'
        + (review.length ? '<p>' + review.length + ' carte' + (review.length > 1 ? 's' : '') + ' à revoir.</p>' : '<p>Parfait, tu connais tout !</p>')
        + '<div class="row">' + (review.length ? '<button class="btn solid" id="again">Revoir les cartes ratées</button>' : '') + '<button class="btn" id="restart">Recommencer</button></div></div>';
      setKeys(null);
    } else {
      var c = deck[idx];
      h += '<div class="bar"><i style="width:' + (idx / deck.length * 100) + '%"></i></div>'
        + '<div class="scene" id="scene"' + cstyle(c) + '><div class="flash ' + (dir > 0 ? 'in' : 'in-back') + '" id="card">' + faces(c) + '</div></div>'
        + '<div class="fc-count">Carte ' + (idx + 1) + ' sur ' + deck.length + '</div>'
        + '<div class="fc-know"><button class="btn no" id="no">À revoir</button><button class="btn yes" id="yes">Je savais</button></div>'
        + '<div class="fc-ctrl"><button class="btn arrow" id="prev" aria-label="Carte précédente">‹</button><button class="btn" id="mix">Mélanger</button><button class="btn arrow" id="next" aria-label="Carte suivante">›</button></div>';
    }
    tab.innerHTML = h;
    tab.querySelectorAll('[data-m]').forEach(function(b){ b.onclick = function(){ mode = b.dataset.m; draw(); }; });
    tab.querySelectorAll('[data-s]').forEach(function(b){ b.onclick = function(){ sens = b.dataset.s; draw(); }; });
    tab.querySelectorAll('.flash').forEach(function(f){ f.onclick = function(){ f.classList.remove('in', 'in-back'); f.classList.toggle('flipped'); }; });
    if ($('again')) $('again').onclick = function(){ reset(review); draw(); };
    if ($('restart')) $('restart').onclick = function(){ reset(); draw(); };
    if (!$('card')) return;
    function next(){ if (idx < deck.length - 1){ idx++; dir = 1; draw(); } }
    function prev(){ if (idx > 0){ idx--; dir = -1; draw(); } }
    function flip(){ var f = $('card'); f.classList.remove('in', 'in-back'); f.classList.toggle('flipped'); }
    $('next').onclick = next; $('prev').onclick = prev;
    $('mix').onclick = function(){ reset(); draw(); };
    $('yes').onclick = function(){ known++; idx++; dir = 1; draw(); };
    $('no').onclick = function(){ review.push(deck[idx]); idx++; dir = 1; draw(); };
    var sx = null, sy = null, sc = $('scene');
    sc.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
    sc.addEventListener('touchend', function(e){
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){ e.preventDefault(); if (dx < 0) next(); else prev(); }
    });
    setKeys(function(e){
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft') prev();
    });
  }
  draw();
}

/* ---------- QCM ---------- */
function renderQcm(tab, bank, key){
  bank = bank.map(function(q){ return {q: q.q, o: q.o, r: q.r, e: q.e, n: q.n || 2, col: q.col, tag: q.tag}; });
  var lvl = 0, nb = 10, qs, i, score, answers;
  function pool(){ return lvl ? bank.filter(function(q){ return q.n === lvl; }) : bank; }

  function start(list){
    qs = list.map(function(q){
      var order = shuffle(q.o.map(function(_, k){ return k; }));
      return {q: q.q, o: order.map(function(k){ return q.o[k]; }), r: order.indexOf(q.r), e: q.e, n: q.n, col: q.col, tag: q.tag};
    });
    i = 0; score = 0; answers = []; draw();
  }
  function intro(){
    var pl = pool(), best = store(key + '_' + lvl);
    var counts = {0: bank.length, 1: 0, 2: 0, 3: 0};
    bank.forEach(function(q){ counts[q.n]++; });
    var opts = [5, 10, 20].filter(function(v){ return v < pl.length; }).concat([pl.length]);
    if (opts.indexOf(nb) < 0) nb = opts[Math.min(1, opts.length - 1)];
    var h = '<div class="panel"><h3>QCM</h3><p class="muted" style="margin:0">Questions et réponses mélangées à chaque essai.</p>'
      + '<p class="set-label">Niveau</p><div class="chips" id="lv">';
    [0, 1, 2, 3].forEach(function(l){ h += '<button data-l="' + l + '" class="' + (lvl === l ? 'on' : '') + '"' + (counts[l] ? '' : ' disabled') + '>' + (l ? NIVEAUX_LBL[l] : 'Tous niveaux') + '<small>' + counts[l] + '</small></button>'; });
    h += '</div><p class="set-label">Nombre de questions</p><div class="chips" id="nbq">';
    opts.forEach(function(v){ h += '<button data-v="' + v + '" class="' + (v === nb ? 'on' : '') + '">' + (v === pl.length ? 'Toutes (' + v + ')' : v) + '</button>'; });
    h += '</div><div class="row" style="justify-content:space-between;margin-top:22px"><button class="btn solid" id="go">Commencer</button>' + (best ? '<span class="muted">Meilleur score : ' + best + ' %</span>' : '') + '</div></div>';
    tab.innerHTML = h;
    tab.querySelectorAll('#lv button').forEach(function(b){ b.onclick = function(){ lvl = +b.dataset.l; intro(); }; });
    tab.querySelectorAll('#nbq button').forEach(function(b){ b.onclick = function(){ nb = +b.dataset.v; tab.querySelectorAll('#nbq button').forEach(function(x){ x.classList.toggle('on', x === b); }); }; });
    $('go').onclick = function(){ start(shuffle(pool()).slice(0, nb)); };
  }
  function draw(){
    if (i >= qs.length) return end();
    var q = qs[i];
    var h = '<div class="panel view"' + (q.col ? ' style="' + colorVars(q.col) + '"' : '') + '><div class="q-meta"><span>Question ' + (i + 1) + ' / ' + qs.length + (q.tag ? ' · ' + esc(q.tag) : '') + '</span><span class="lvl">' + NIVEAUX_LBL[q.n] + '</span></div>'
      + '<div class="bar" style="max-width:none"><i style="width:' + (i / qs.length * 100) + '%"></i></div>'
      + '<div class="q-text">' + esc(q.q) + '</div><div class="opts">';
    q.o.forEach(function(o, k){ h += '<button class="opt" data-k="' + k + '"><span class="k">' + 'ABCD'[k] + '</span><span>' + esc(o) + '</span></button>'; });
    h += '</div><div id="fb"></div></div>';
    tab.innerHTML = h;
    tab.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        var k = +b.dataset.k, ok = k === q.r;
        if (ok) score++;
        answers.push({q: q, choix: k, ok: ok});
        tab.querySelectorAll('.opt').forEach(function(x){
          x.disabled = true;
          var xk = +x.dataset.k;
          if (xk === q.r) x.classList.add('good'); else if (xk === k) x.classList.add('bad'); else x.classList.add('dim');
        });
        $('fb').innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'ko') + '"><b>' + (ok ? 'Bonne réponse' : 'Pas tout à fait') + '</b>' + esc(q.e || '') + '</div>'
          + '<div class="q-next"><button class="btn solid" id="nx">' + (i === qs.length - 1 ? 'Voir mon score' : 'Question suivante') + '</button></div>';
        $('nx').onclick = function(){ i++; draw(); };
        setKeys(function(e){ if (e.key === 'Enter'){ e.preventDefault(); setKeys(null); i++; draw(); } });
      };
    });
  }
  function end(){
    setKeys(null);
    var pct = Math.round(score / qs.length * 100), bk = key + '_' + lvl;
    if (pct > (store(bk) || 0)) store(bk, pct);

<!-- =====================================================================
     STATISTIQUES DE VISITES (GoatCounter : sans cookie, sans donnée personnelle)
     Tableau de bord : https://michalaksvt-1spe.goatcounter.com
     Compte seulement de grandes catégories : ouverture du site, cours, activités,
     flashcards, QCM lancé, méthodes, glossaire, tout réviser.
     Pour arrêter : supprimer ce bloc.
     ===================================================================== -->
<script>
(function(){
  var COMPTEUR = 'https://michalaksvt-1spe.goatcounter.com/count';
  var CATEGORIES = {
    ouverture: 'Ouverture du site', cours: 'Cours', activites: 'Activités', flashcards: 'Flashcards',
    qcm: 'QCM lancé', methodes: 'Méthodes', glossaire: 'Glossaire', revision: 'Tout réviser'
  };
  var file = [], pret = false;
  function compter(cat){
    if (!CATEGORIES[cat]) return;
    var o = {path: '/' + cat, title: CATEGORIES[cat]};
    if (pret) { try { window.goatcounter.count(o); } catch(e){} } else file.push(o);
  }
  /* Le script de GoatCounter ne compte rien tout seul (no_onload) : c'est nous qui envoyons les catégories */
  window.goatcounter = {no_onload: true, allow_frame: true};
  var s = document.createElement('script');
  s.async = true; s.src = 'https://gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter', COMPTEUR);
  s.onload = function(){ pret = !!(window.goatcounter && window.goatcounter.count); if (pret) file.splice(0).forEach(function(o){ try { window.goatcounter.count(o); } catch(e){} }); };
  document.head.appendChild(s);

  var ONGLET = {essentiel: 'cours', activites: 'activites', flashcards: 'flashcards'};
  var VUE = {glossaire: 'glossaire', methodes: 'methodes', revision: 'revision'};
  var dernier = null;
  function etat(){
    if (typeof S === 'undefined') return null;
    if (S.view === 'partie' && S.partie) return {cle: 'p:' + S.partie.id + ':' + S.tab, cat: ONGLET[S.tab]};
    return {cle: 'v:' + S.view, cat: VUE[S.view]};
  }
  function suivre(){
    var e = etat(); if (!e || e.cle === dernier) return;
    dernier = e.cle;
    if (e.cat) compter(e.cat);
  }
  compter('ouverture');
  var e0 = etat(); dernier = e0 ? e0.cle : null;
  if (e0 && e0.cle.indexOf('p:') === 0 && e0.cat) compter(e0.cat);   /* site ouvert directement sur une partie */
  /* Changements de page et d'onglet */
  if (typeof render === 'function'){ var r0 = render; render = function(){ r0.apply(this, arguments); suivre(); }; }
  if (typeof switchTab === 'function'){ var t0 = switchTab; switchTab = function(){ t0.apply(this, arguments); suivre(); }; }
  /* Chaque QCM lancé (bouton « Commencer »), où qu'il soit */
  document.addEventListener('click', function(ev){
    if (ev.target && ev.target.closest && ev.target.closest('#go')) compter('qcm');
  }, true);
})();
</script>
