<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVT</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ef; --surface:#ffffff; --ink:#1d2227; --ink-2:#3a4148; --muted:#6b7178; --line:#e4e0d6; --line-2:#d6d1c5;
  --ok:#2f7d4f; --ok-soft:#e8f3ec; --ko:#b8412f; --ko-soft:#f8e9e5;
  --c:#1f7a8c; --c-soft:rgba(31,122,140,.08); --c-mid:rgba(31,122,140,.22); --c-ink:#15535f;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --ease:cubic-bezier(.2,.75,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--paper);max-width:100%}
body{min-height:100vh;max-width:100%}
img,table,svg{max-width:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;font-size:1rem;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
a{color:var(--c-ink)}
sup,sub{line-height:0}
.wrap{max-width:900px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}

/* ---------- Barre du haut ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.01em}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs button{color:var(--muted);padding:8px 0}
.crumbs .cur{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}

main{padding:clamp(22px,5vw,44px) 0 56px}
.view{animation:appear .4s var(--ease)}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.kicker{font-size:.76rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin:0 0 8px}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.005em}

/* ---------- Accueil ---------- */
.home-head h1{font-size:clamp(2rem,4vw + 1rem,2.9rem);line-height:1.1;margin:0 0 8px}
.home-head .lead{color:var(--muted);margin:0 0 34px;font-size:1rem}
.chapter{margin-bottom:38px}
.ch-head{border-top:3px solid var(--c);padding-top:12px;margin-bottom:14px}
.ch-head .kicker{margin-bottom:2px}
.ch-head h2{margin:0;font-size:clamp(1.2rem,1.2vw + .9rem,1.45rem);line-height:1.3}
/* Chapitre repliable + pastille « Nouveau » */
button.ch-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;font:inherit;color:inherit}
button.ch-head .kicker,button.ch-head .ch-h{display:block}
button.ch-head .ch-h{font-family:var(--serif);font-weight:700;letter-spacing:-.005em;font-size:clamp(1.2rem,1.2vw + .9rem,1.45rem);line-height:1.3}
.ch-act{flex:none;margin-top:2px;font-size:.82rem;font-weight:600;color:var(--c-ink);background:var(--c-soft);border:1px solid var(--c-mid);border-radius:999px;padding:6px 12px;white-space:nowrap}
.ch-act::after{content:"";display:inline-block;width:.45em;height:.45em;margin-left:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .25s var(--ease)}
.chapter:not(.closed) .ch-act::after{transform:translateY(1px) rotate(-135deg)}
.chapter.closed{margin-bottom:16px}
.chapter.closed .parts{display:none}
.chapter.closed .ch-head{margin-bottom:0}
.badge-new{display:inline-block;vertical-align:middle;margin-left:10px;padding:2px 9px;border-radius:999px;background:var(--c);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.5}
@media (max-width:520px){button.ch-head{flex-direction:column;gap:10px}.ch-act{align-self:flex-start;margin-top:0}}
@media (max-width:420px){.ch-act{padding:6px 10px;font-size:.78rem}}
.parts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.part{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .25s,transform .25s var(--ease),box-shadow .25s}
.part .pid{grid-row:span 3;font-family:var(--serif);font-weight:700;font-size:1.35rem;color:var(--c);line-height:1.2;min-width:30px}
.part h3{margin:0;font-size:1.1rem;line-height:1.3}
.part .pq{margin:4px 0 0;font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:.95rem;line-height:1.5}
.part .go{margin-top:10px;font-size:.85rem;font-weight:600;color:var(--c-ink)}
@media (hover:hover){.part:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 8px 20px -14px rgba(0,0,0,.3)}}
.revise{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.revise h3{margin:0;font-size:1.1rem}
.revise p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:.93rem;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);text-decoration:none;transition:background .2s,border-color .2s,color .2s,transform .12s}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--c);border-color:var(--c);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--c-ink);padding-left:0;padding-right:0}
@media (hover:hover){.btn:hover{border-color:var(--c)}.btn.solid:hover{background:var(--c-ink);border-color:var(--c-ink)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- En-tête de partie ---------- */
.hero{margin-bottom:20px}
.hero h1{font-size:clamp(1.65rem,3vw + 1rem,2.5rem);line-height:1.15;margin:0 0 14px}
.probl{margin:0;padding:4px 0 4px 16px;border-left:3px solid var(--c);font-family:var(--serif);font-style:italic;font-size:clamp(1rem,.5vw + .9rem,1.12rem);color:var(--ink-2);line-height:1.55;max-width:62ch}
.probl span{display:block;font-family:var(--sans);font-style:normal;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:2px}

/* ---------- Onglets ---------- */
.tabs{position:sticky;top:52px;z-index:20;background:var(--paper);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--line);margin:0 0 24px}
.tabs button{position:relative;min-width:0;min-height:48px;padding:10px 4px;font-weight:600;font-size:.94rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.tabs button::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--c);transform:scaleX(0);transition:transform .3s var(--ease)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{transform:scaleX(1)}

/* ---------- Activités ---------- */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;transition:border-color .25s}
.acc.open{border-color:var(--line-2)}
.acc-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;min-height:64px}
.acc-head .t{flex:1;min-width:0}
.acc-head .type{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:2px}
.acc-head .name{display:block;font-family:var(--serif);font-weight:600;font-size:1.08rem;line-height:1.35}
.chev{flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px;transition:transform .35s var(--ease)}
.open > .acc-head .chev,.open > .more-btn .chev{transform:rotate(225deg);margin-bottom:-4px}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.open > .fold{grid-template-rows:1fr}
.fold > div{overflow:hidden;min-height:0}
.acc-body{padding:0 18px 20px}
.summary{font-family:var(--serif);font-size:1.02rem;line-height:1.65;color:var(--ink-2);margin:0 0 16px}
.corr-title{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.corr-item{margin:0 0 14px}
.corr-item .cq{display:flex;gap:10px;align-items:baseline;font-weight:600;font-size:.93rem;margin-bottom:3px}
.corr-item .cq b{flex:0 0 auto;font-size:.74rem;color:var(--c-ink);background:var(--c-soft);border-radius:6px;padding:1px 7px}
.corr-item .ca{margin:0;font-family:var(--serif);font-size:1rem;line-height:1.6}
/* Activités, nouvelle présentation (chapitre 2) */
.act2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;scroll-margin-top:110px}
.act2.act-flash{animation:flashAct 1.8s ease}
@keyframes flashAct{0%,55%{box-shadow:0 0 0 3px var(--c-mid)}100%{box-shadow:0 0 0 0 transparent}}
/* Cadres d'activité (reprise des cadres des documents de classe) : bleu = activité, jaune = TP */
.fr-bar,.act2-head{display:flex;align-items:center;gap:.55em;width:100%;text-align:left;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:clamp(1.02rem,.6vw + .92rem,1.3rem);line-height:1.3;color:#000;padding:12px 16px;border-radius:10px;background:#D4EBF8}
.fr-bar.fr-tp,.act2-head.fr-tp{background:#FDFFD2}
.fr-tag,.fr-box{display:inline-block;flex:none;background:#fff;border:2px solid #000;padding:0 .3em;line-height:1.25;font-family:Arial,Helvetica,sans-serif;font-weight:700;color:#000}
.fr-t{flex:1;min-width:0}
.fr-go{flex:none;font-size:.82rem;font-weight:700;white-space:nowrap;color:#000}
.act2-head .chev{border-color:#000;flex:none}
.act2.open > .act2-head{border-radius:10px 10px 0 0}
.open > .act2-head .chev{transform:rotate(225deg);margin-bottom:-4px}
button.fr-bar{cursor:pointer;margin:4px 0 20px;min-height:56px;transition:filter .2s,transform .15s}
@media (hover:hover){button.fr-bar:hover,.act2-head:hover{filter:brightness(.97)}}
button.fr-bar:active{transform:scale(.99)}
.fr-consigne{display:inline-block;margin:6px 0 10px;font-size:1.5rem;padding:0 .3em;border-width:3px;font-family:Arial,Helvetica,sans-serif;font-weight:700;background:#fff;border:3px solid #000;color:#000}
.fr-cs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 12px;padding:10px 14px;background:#E7E6E6;border-radius:8px;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:1.3rem;color:#000}
.act2-b{padding:18px 20px 20px;background:var(--surface);border-radius:0 0 10px 10px}
.act2-q2{margin:0 0 14px;font-family:var(--serif);font-style:italic;font-weight:600;color:var(--ink-2);line-height:1.5}
.act2-view{margin:0 0 18px;width:100%}
.act2-lab{display:block;margin:0 0 6px;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.act2-res{margin:0 0 18px;font-family:var(--serif);font-size:1.02rem;line-height:1.65;color:var(--ink-2);text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.act2-ret{margin:0 0 18px;padding:14px 16px;border-radius:10px;background:var(--c-soft);border:1px solid var(--c-mid)}
.act2-ret .act2-lab{color:var(--c-ink)}
.act2-ret p{margin:0;font-family:var(--serif);font-size:1rem;line-height:1.6;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.act2-ret p + p{margin-top:8px}
.act2-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:10px 16px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-weight:600;color:var(--ink);text-align:left}
@media (hover:hover){.act2-btn:hover{border-color:var(--c)}}
.open > .act2-btn .chev{transform:rotate(225deg);margin-bottom:-4px}
.steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:st;display:grid;gap:16px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;counter-increment:st}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
html.th-sombre .steps li::before{color:#10151a}
.steps h4{margin:3px 0 4px;font-family:var(--sans);font-size:.98rem;font-weight:600;line-height:1.4}
.steps p{margin:0;font-family:var(--serif);font-size:1rem;line-height:1.65;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.steps .tbl{margin:8px 0 0}
.act2-suite{margin:18px 0 0;padding:12px 14px;border-radius:10px;background:var(--c-soft);font-family:var(--serif);font-size:.98rem;line-height:1.6}
.act2-suite .act2-lab{color:var(--c-ink)}
.ext{display:inline-flex;margin-top:4px;font-weight:600;font-size:.9rem;color:var(--c-ink);text-decoration:none;min-height:40px;align-items:center}

/* ---------- Tableaux : cadre de couleur, titre en bandeau, grille complète (cartes encadrées sur téléphone) ---------- */
.tbl{overflow-x:auto;margin:20px 0;border:2px solid var(--c);border-radius:12px;background:var(--surface);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 18%,transparent);-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
.tbl caption{caption-side:top;text-align:left;padding:9px 14px;background:var(--c);color:#fff;font-weight:700;font-size:.95rem;letter-spacing:.01em}
.tbl th,.tbl td{padding:10px 14px;text-align:left;vertical-align:top;border:1px solid color-mix(in srgb,var(--c) 38%,var(--line))}
.tbl tr > :first-child{border-left:none}
.tbl tr > :last-child{border-right:none}
.tbl thead tr:first-child > *{border-top:none}
.tbl tbody tr:last-child > *{border-bottom:none}
.tbl thead th{background:var(--c-soft);color:var(--c-ink);font-weight:700;font-size:.88rem;border-bottom:2px solid var(--c)}
.tbl thead th:first-child:empty{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.tbl tbody th{background:color-mix(in srgb,var(--c) 9%,var(--surface));color:var(--c-ink);font-weight:700;border-right:2px solid color-mix(in srgb,var(--c) 55%,var(--line))}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--c) 4%,var(--surface))}
@media (max-width:560px){
  .tbl{border:none;background:none;box-shadow:none;overflow:visible}
  .tbl caption{display:block;width:100%;border-radius:10px;margin-bottom:10px}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl th,.tbl td{display:block;width:100%}
  .tbl tr{background:var(--surface);border:2px solid var(--c);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .tbl tbody th{background:var(--c-soft);color:var(--c-ink);border:none;border-bottom:2px solid var(--c);padding:9px 14px}
  .tbl td,.tbl tbody tr:nth-child(even) td{display:block;text-align:left;background:none;border:none;border-bottom:1px solid color-mix(in srgb,var(--c) 30%,var(--line));padding:8px 14px}
  .tbl td:last-child{border-bottom:none}
  .tbl td::before{content:attr(data-label);display:block;color:var(--c-ink);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;opacity:.85}
}

/* ---------- L'essentiel ---------- */
.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:-6px 0 26px;padding:0 0 16px;border-bottom:1px solid var(--line)}
.toc button{font-size:.88rem;color:var(--c-ink);font-weight:600;min-height:36px;text-align:left}
.toc button span{font-family:var(--serif);margin-right:6px}
.lesson{max-width:none}
.lesson section{margin-bottom:34px;scroll-margin-top:110px}
.lesson h2{font-size:clamp(1.25rem,1vw + 1rem,1.5rem);line-height:1.3;margin:0 0 12px;display:flex;gap:12px;align-items:baseline}
.lesson h2 .num{color:var(--c);font-weight:700;flex:0 0 auto}
.lesson p{font-family:var(--serif);font-size:clamp(1.02rem,.3vw + .98rem,1.1rem);line-height:1.75;margin:0 0 14px;color:var(--ink);hyphens:auto;-webkit-hyphens:auto}
.lesson b{font-weight:700;background:rgba(255,228,110,.62);border-radius:3px;padding:0 .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
html.th-sombre .lesson b{background:rgba(255,205,70,.2)}
.aside{margin:18px 0;padding:14px 18px;background:var(--c-soft);border-radius:10px}
.aside .lab{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:4px}
.aside p{font-size:.98rem;line-height:1.65;margin:0}
.recap{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:18px 20px;margin-top:10px}
.recap .lab{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:6px}
.recap p{margin:0}
.recap p + p{margin-top:10px}
.recap p.rt{font-family:var(--sans);font-size:.78rem;font-weight:700;color:var(--ink-2);margin-top:16px}
.recap .lab + p.rt{margin-top:4px}
.recap p.rt + p{margin-top:4px}
/* Chapitre 2 : problématique de section, bouton vers l'activité, figure */
.lesson p.sec-prob{margin:0 0 14px;font-style:italic;color:var(--ink-2)}
.sec-prob span{font-family:var(--sans);font-style:normal;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-right:8px}
@media (hover:hover){.act-link:hover{border-color:var(--c)}}
.act-link:active{transform:scale(.99)}
.fig{margin:24px 0}
.fig img,.vw-fig img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.fig figcaption,.vw-fig figcaption{font-size:.82rem;color:var(--muted);margin-top:6px}
.zoom-hint{font-family:var(--sans);font-size:.76rem;color:var(--muted);margin:0 0 6px}

/* Visualiseur d'activité (plein écran) */
.vw{position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.vw-in{max-width:860px;margin:0 auto;padding:0 clamp(14px,4vw,24px) 44px}
.vw-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;background:var(--paper);border-bottom:1px solid var(--line);margin-bottom:16px}
.vw-top span{font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.vw-intro,.vw-cherche,.vw-doc p,.vw-poste li,.vw-syn p,.vw-syn li{font-family:var(--serif);font-size:1.04rem;line-height:1.7;margin:0 0 10px;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.vw-cherche{font-style:italic;font-weight:600}
.vw-cs{display:grid;gap:8px;margin:0 0 6px}
.vw-cs p{margin:0}
.vw-cs .fr-box{margin-right:8px;font-size:.95rem}
.vw-doc{margin:24px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.vw-doc h4,.vw-poste h4,.vw-syn h4{font-family:Arial,Helvetica,sans-serif;font-size:1.08rem;margin:0 0 10px;font-weight:700}
.vw-src{font-size:.8rem !important;color:var(--muted);font-family:var(--sans) !important;line-height:1.5 !important}
.vw-fig{margin:12px 0}
.vw-poste{margin:20px 0 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.vw-poste ul,.vw-poste ol,.vw-syn ul{margin:4px 0 10px;padding-left:22px}
.vw-poste .lab{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}
.vw-poste .note{font-style:italic;color:var(--ink-2);margin:0}
.vw-syn{margin:20px 0 0;padding:14px 16px;background:var(--c-soft);border-radius:10px}
.vw-foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}

/* Lightbox : agrandir les images */
.lb{position:fixed;inset:0;z-index:120;background:rgba(10,14,18,.93);display:flex;flex-direction:column}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;color:#fff}
.lb-bar .grp{display:flex;gap:8px}
.lb-bar button{min-height:44px;min-width:44px;padding:8px 16px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:1rem}
.lb-bar span{font-size:.82rem;opacity:.8;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;padding:0 10px 14px}
.lb-scroll img{margin:auto;max-width:100%;max-height:100%;background:#fff;border-radius:6px;cursor:zoom-in;width:auto;height:auto}
.lb-scroll img.z{max-width:none;max-height:none;cursor:zoom-out}
.facts{margin:0;padding-left:20px}
.facts li{font-family:var(--serif);font-size:.98rem;line-height:1.6;margin:3px 0}
.aside .src{font-size:.8rem;color:var(--muted);margin-top:6px}
.hint-line{font-size:.85rem;color:var(--muted);margin:0 0 20px}
.hint-line .term{pointer-events:none}

/* Termes avec définition */
.term{font:inherit;color:inherit;display:inline;padding:0;border-bottom:1.5px dotted var(--c);cursor:help;border-radius:2px;transition:background .2s}
.term.active,.term:focus-visible{background:var(--c-mid);outline:none}
@media (hover:hover){.term:hover{background:var(--c-soft)}}
.tip{position:absolute;z-index:50;top:0;left:0;background:var(--ink);color:#fff;border-radius:10px;padding:11px 14px 12px;font-size:.9rem;line-height:1.5;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .18s,transform .18s,visibility .18s}
.tip.show{opacity:1;visibility:visible;transform:none}
.tip b{display:block;font-family:var(--serif);font-size:1rem;margin-bottom:2px;color:#fff}
.tip .arrow{position:absolute;top:-6px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.tip.above .arrow{top:auto;bottom:-6px}

/* ---------- Navigation entre parties ---------- */
.next-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.next-nav button{text-align:left;max-width:48%;min-height:44px}
.next-nav button:last-child{text-align:right;margin-left:auto}
.next-nav small{display:block;color:var(--muted);font-size:.78rem}
.next-nav span{font-family:var(--serif);font-weight:600;color:var(--c-ink)}
@media (max-width:560px){.next-nav button{max-width:100%}}

/* ---------- Flashcards ---------- */
.fc-tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.pills{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.pills button{min-height:36px;padding:6px 12px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted);transition:background .2s,color .2s}
.pills button.on{background:var(--ink);color:var(--paper)}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;max-width:620px;margin:0 auto 16px}
.bar > i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s var(--ease)}
.scene{perspective:1400px;max-width:620px;margin:0 auto;touch-action:pan-y}
.flash{position:relative;width:100%;height:clamp(250px,50vw,340px);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .6s var(--ease);cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.flash.in{animation:slin .35s var(--ease)}
.flash.in-back{animation:slback .35s var(--ease)}
@keyframes slin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes slback{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.face{position:absolute;top:0;left:0;right:0;bottom:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px clamp(18px,4vw,34px) 30px;text-align:center;overflow:auto}
.face.front{background:var(--surface);border:1px solid var(--line-2);border-top:4px solid var(--c)}
.face.back{background:var(--c);color:#fff;transform:rotateY(180deg)}
.face .lab{position:absolute;top:12px;left:16px;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.face .code{position:absolute;top:10px;right:14px;font-size:.72rem;font-weight:700;color:var(--c-ink)}
.face.back .code{color:#fff;opacity:.8}
.face .term-big{font-family:var(--serif);font-size:clamp(1.4rem,2.2vw + .9rem,2rem);font-weight:700;line-height:1.25}
.face .def{font-family:var(--serif);font-size:clamp(1.02rem,.6vw + .88rem,1.2rem);line-height:1.55}
.face .hint{position:absolute;bottom:10px;font-size:.76rem;opacity:.45}
.fc-count{text-align:center;color:var(--muted);font-size:.86rem;margin:12px 0 2px}
.fc-know{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:620px;margin:10px auto 0}
.fc-know .no{color:var(--ko);background:var(--ko-soft);border-color:transparent}
.fc-know .yes{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.fc-ctrl{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;max-width:620px;margin:10px auto 0}
.fc-ctrl .btn{padding:0}
.fc-ctrl .arrow{font-size:1.3rem}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fc-grid .scene{max-width:none;width:100%;margin:0}
.fc-grid .flash{height:190px}
.fc-grid .face{padding:28px 14px 14px;border-radius:12px}
.fc-grid .face .term-big{font-size:1.12rem}
.fc-grid .face .def{font-size:.9rem}
.done{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(22px,5vw,38px);text-align:center;max-width:620px;margin:0 auto}
.done .big{font-family:var(--serif);font-size:clamp(2.3rem,5vw + 1rem,3.2rem);font-weight:700;color:var(--c);line-height:1}
.done p{color:var(--muted)}
.done .row{justify-content:center;margin-top:16px}

/* ---------- QCM ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,30px);max-width:700px;margin:0 auto}
.panel h3{margin:0 0 4px;font-size:1.25rem}
.muted{color:var(--muted);font-size:.9rem}
.set-label{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line-2);font-weight:600;font-size:.88rem;color:var(--ink-2);transition:all .2s}
.chips button small{color:var(--muted);font-weight:500;margin-left:4px}
.chips button.on{background:var(--c);border-color:var(--c);color:#fff}
.chips button.on small{color:rgba(255,255,255,.8)}
.chips button:disabled{opacity:.35;cursor:default}
.q-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.84rem;margin-bottom:8px}
.lvl{font-weight:600;color:var(--c-ink)}
.q-text{font-family:var(--serif);font-size:clamp(1.12rem,.8vw + .95rem,1.3rem);font-weight:600;line-height:1.45;margin:16px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;min-height:52px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.97rem;transition:border-color .2s,background .2s,opacity .2s}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:var(--muted)}
@media (hover:hover){.opt:hover:not([disabled]){border-color:var(--c)}}
.opt[disabled]{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)}
.opt.bad .k{background:var(--ko);color:#fff}
.opt.dim{opacity:.5}
.feedback{margin-top:16px;padding:13px 16px;border-radius:10px;font-size:.95rem;animation:appear .3s var(--ease)}
.feedback.ok{background:var(--ok-soft)}
.feedback.ko{background:var(--ko-soft)}
.feedback b{display:block;margin-bottom:2px}
.feedback.ok b{color:var(--ok)}
.feedback.ko b{color:var(--ko)}
.q-next{display:flex;justify-content:flex-end;margin-top:14px}
.score{font-family:var(--serif);font-size:clamp(2.6rem,6vw + 1rem,3.6rem);font-weight:700;color:var(--c);line-height:1;margin:6px 0 4px}
.center{text-align:center}
.more-btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;color:var(--c-ink);min-height:44px}
.more-btn .chev{width:8px;height:8px;border-color:var(--c-ink);margin:0 2px 3px}
.review-item{border-top:1px solid var(--line);padding:12px 0;font-size:.93rem;text-align:left}
.review-item .r-ok{color:var(--ok);font-weight:600}
.review-item .r-ko{color:var(--ko);font-weight:600}

/* ---------- Téléphones ---------- */
@media (max-width:480px){
  body{font-size:.97rem}
  main{padding-top:20px}
  .topbar .wrap{min-height:48px}
  .tabs{top:48px}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;font-size:.8rem;min-height:46px;padding:10px 5px;overflow:visible;text-overflow:clip}
  .tabs button::after{left:6px;right:6px}
  .parts{grid-template-columns:1fr}
  .part{padding:16px}
  .acc-head{padding:14px 14px}
  .acc-body{padding:0 14px 18px}
  .fc-tools{justify-content:center}
  .pills button{padding:6px 10px;font-size:.8rem}
  .panel{padding:18px 16px}
}
/* ---------- Barre du haut : glossaire et réglages ---------- */
.topbar .wrap{position:relative}
.top-actions{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.tbtn{white-space:nowrap;flex:0 0 auto;min-height:36px;padding:6px 12px;border:1px solid var(--line-2);border-radius:8px;font-size:.86rem;font-weight:600;background:var(--surface);transition:border-color .2s}
.tbtn.on{border-color:var(--ink)}
@media (hover:hover){.tbtn:hover{border-color:var(--ink)}}
.settings{position:absolute;right:clamp(16px,4vw,32px);top:calc(100% + 6px);width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:16px;box-shadow:0 14px 34px -14px rgba(0,0,0,.35);display:none;z-index:40}
.settings.show{display:block;animation:appear .25s var(--ease)}
.settings .set-label:first-child{margin-top:0}
.settings .pills{display:flex}
.settings .pills button{flex:1}
.settings .note{font-size:.8rem;color:var(--muted);margin:10px 0 0;line-height:1.45}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- Réglages de lecture ---------- */
/* Thèmes : bleu (par défaut), papier, clair, sombre */
html.th-bleu{--paper:#d9ccf1;--surface:#f6f1fd;--ink:#1b1531;--ink-2:#352c52;--muted:#5c5080;--line:#c2b0e5;--line-2:#a590d6}
html.th-clair{--paper:#ffffff;--surface:#ffffff;--ink:#000000;--ink-2:#1a1a1a;--muted:#4d4d4d;--line:#e3e3e3;--line-2:#cdcdcd}
html.th-sombre{color-scheme:dark;--paper:#16191c;--surface:#1f2327;--ink:#ebe8e2;--ink-2:#d3cfc7;--muted:#9ba1a7;--line:#2e3439;--line-2:#3d444b;--ok:#62c78f;--ok-soft:rgba(98,199,143,.14);--ko:#ef8472;--ko-soft:rgba(239,132,114,.15)}
html.th-sombre .face.back,html.th-sombre .btn.solid,html.th-sombre .chips button.on{background:var(--c-deep,var(--c));border-color:var(--c-deep,var(--c))}
html.th-sombre .btn.solid:hover{background:var(--c);border-color:var(--c)}
html.th-sombre .tip,html.th-sombre .tip .arrow{background:#2e3439}
html.th-sombre .tip{border:1px solid #454d54;color:#ebe8e2}
html.th-sombre .part:hover,html.th-sombre .settings{box-shadow:0 14px 34px -14px rgba(0,0,0,.8)}
.nav-btn{display:none}
.nav-btn.show{display:inline-flex;align-items:center}
.brand.hide{display:none}
html.f-lex{--serif:'Lexend',system-ui,sans-serif;--sans:'Lexend',system-ui,sans-serif}
html.f-lex .probl,html.f-lex .part .pq{font-style:normal}
html.sp-wide body{letter-spacing:.03em;word-spacing:.12em}
html.sp-wide .lesson p,html.sp-wide .aside p,html.sp-wide .recap p,html.sp-wide .summary,html.sp-wide .corr-item .ca,html.sp-wide .model,html.sp-wide .gl-item p{line-height:1.95}
html.sp-wide .lesson p,html.sp-wide .aside p,html.sp-wide .recap p,html.sp-wide .summary,html.sp-wide .corr-item .ca,html.sp-wide .probl,html.sp-wide .part .pq,html.sp-wide .feedback,html.sp-wide .review-item .muted,html.sp-wide .model{text-align:left;-webkit-hyphens:manual;hyphens:manual}

/* ---------- Glossaire ---------- */
.gl-search{display:block;width:100%;font:inherit;font-size:1.05rem;padding:13px 16px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);margin:0 0 8px;-webkit-appearance:none;appearance:none}
.gl-filter{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:4px 0 10px}
.gl-filter .set-label{margin:0}
.gl-filter .pills{flex-wrap:wrap;max-width:100%}
.gl-info{font-size:.86rem;color:var(--muted);margin:0 0 10px;min-height:1.3em}
.gl-letter{font-family:var(--serif);font-weight:700;color:var(--ink-2);font-size:1.15rem;margin:22px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line-2)}
.gl-item{padding:13px 0;border-bottom:1px solid var(--line)}
.gl-item h3{margin:0 0 3px;font-size:1.08rem}
.gl-item p{margin:0;font-family:var(--serif);line-height:1.6}
.gl-tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.gl-tags button{font-size:.78rem;font-weight:600;color:var(--c-ink);background:var(--c-soft);border-radius:6px;padding:3px 10px;min-height:30px}
mark{background:var(--c-mid);color:inherit;border-radius:2px;padding:0 1px}

/* ---------- Accueil ---------- */
.extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.extras .revise{flex-wrap:nowrap}


@media (max-width:520px){.crumbs{display:none}}
@media (max-width:420px){.topbar .wrap{gap:6px}.top-actions{gap:5px}.tbtn{padding:6px 9px;font-size:.8rem}}

/* ---------- Tuto ---------- */
.tuto-intro{font-family:var(--serif);font-size:1.02rem;line-height:1.7;margin:0 0 18px}
.tuto-steps{counter-reset:st;list-style:none;padding:0;margin:0 0 26px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tuto-steps li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 52px;font-size:.93rem;line-height:1.5}
.tuto-steps li::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.tuto-steps li b{display:block;margin-bottom:2px}
.tuto-list{margin:0 0 6px;padding-left:20px}
.tuto-list li{margin:6px 0;line-height:1.55}
.kbd{display:inline-block;font-family:var(--sans);font-size:.78rem;font-weight:600;padding:1px 7px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;background:var(--surface)}

/* Texte justifié (avec césure pour éviter les grands espaces) */
.lesson p,.aside p,.recap p,.summary,.corr-item .ca,.probl,.part .pq,.feedback,.review-item .muted{text-align:justify;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hl-v,.hl-e{color:inherit;border-radius:4px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-v{background:rgba(250,214,40,.5)}
.hl-e{background:rgba(110,205,95,.42)}
.meth-card{background:#fff5cc;border-color:#ecd27a;margin-bottom:30px}
html.th-sombre .meth-card{background:rgba(250,214,40,.13);border-color:rgba(224,180,0,.45)}
.meth-card h3 mark{font-weight:700}
.part.nonum{grid-template-columns:1fr}
.meth-card{cursor:pointer;transition:border-color .25s,transform .25s var(--ease),box-shadow .25s}
.meth-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(120,90,0,.12)}
.meth-card:active{transform:translateY(0)}
.meth-card:focus-visible{outline:2px solid #e0b400;outline-offset:2px}
.m-steps{counter-reset:st;list-style:none;padding:0;margin:0 0 26px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.m-steps li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 16px 56px}
.m-steps li::before{counter-increment:st;content:counter(st);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:0;background:#fff;color:#000;border:2px solid #000;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.fr-bar.fr-gris,.fr-gris{background:#E7E6E6}
.m-verbe{margin:0 0 30px}
.m-verbe .fr-bar{margin:0 0 12px;font-size:clamp(1rem,.5vw + .92rem,1.2rem)}
h1.m-h1{margin:0 0 14px;font-size:clamp(1.3rem,1.6vw + 1rem,1.8rem);line-height:1.25;font-family:Arial,Helvetica,sans-serif;letter-spacing:0}
.m-bref{margin-bottom:6px}
.m-steps h3{margin:2px 0 10px;font-size:1.08rem}
.m-steps p{margin:0 0 10px;line-height:1.55;font-size:.95rem}
.m-steps p:last-child{margin:0}
.m-opt{font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;vertical-align:middle;margin-left:4px}
.m-lab{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.m-ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:26px}
.m-ex p{margin:0 0 14px;line-height:1.65}
.m-ex>p:last-child{margin-bottom:0}
.m-rep{border-left:3px solid var(--c);padding-left:16px}
.m-rep p{font-family:var(--serif);margin:0 0 8px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.m-err{margin:0;padding-left:20px}
.m-err li{margin:8px 0;line-height:1.55}

/* ---------- Fiches méthode ---------- */
/* Entrée sur l'accueil */
.mf-entry{display:inline-flex;align-items:center;gap:10px;margin:0 0 30px;padding:9px 12px 9px 16px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;cursor:pointer;transition:border-color .2s,transform .2s var(--ease),box-shadow .2s}
.mf-entry-t{font-weight:700;font-size:1rem;color:var(--ink)}
.badge-new.mf-new{margin-left:0;background:#6a4bb0}
html.th-sombre .badge-new.mf-new{background:#b8a2ee;color:#16191c}
.mf-entry-go{font-size:.86rem;font-weight:600;color:#6a4bb0;padding:4px 10px;border-radius:999px;background:rgba(106,75,176,.1)}
html.th-sombre .mf-entry-go{color:#d3c6f7;background:rgba(184,162,238,.14)}
@media (hover:hover){.mf-entry:hover{border-color:#6a4bb0;transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(60,30,120,.4)}}
.mf-entry:focus-visible{outline:2px solid #6a4bb0;outline-offset:2px}
/* Pages larges (liste et fiches) : on utilise la largeur de l'écran */
.ml,.mf{width:min(1160px,calc(100vw - 32px));margin-left:calc(50% - min(580px,calc(50vw - 16px)))}
/* Liste */
.ml-head h1{font-size:clamp(2rem,3vw + 1rem,2.8rem);line-height:1.1;margin:0 0 26px}
.ml-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.mc{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:160px;transition:border-color .2s,transform .2s var(--ease),box-shadow .2s}
.mc .fr-tag{font-size:1.1rem}
.mc-t{font-weight:700;font-size:1.22rem;line-height:1.3;color:var(--ink)}
.mc-go{margin-top:auto;font-size:.95rem;font-weight:600;color:var(--c-ink)}
@media (hover:hover){.mc:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(40,20,90,.45)}}
.mc.feat{grid-column:1/-1;min-height:0;background:#e2761b;border-color:#c9620f;padding:24px 26px}
.mc.feat .mc-t{font-size:1.5rem;color:#fff}
.mc.feat .mc-go{color:#fff;opacity:.95}
@media (hover:hover){.mc.feat:hover{border-color:#a94f08;box-shadow:0 12px 26px -14px rgba(160,70,0,.6)}}
/* Fiche */
.mf{font-size:1.04rem}
.mf-head{margin:0 0 24px}
.mf-head .fr-tag{font-size:1.2rem}
.mf-head h1{font-size:clamp(1.9rem,2.8vw + 1rem,2.8rem);line-height:1.1;margin:12px 0 10px}
.mf-lead{font-family:var(--serif);font-size:clamp(1.05rem,.5vw + .98rem,1.2rem);color:var(--ink-2);margin:0;line-height:1.6;max-width:70ch}
.mf-row{display:grid;gap:18px;margin:0 0 18px}
@media (min-width:900px){.mf-row.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.mf-row.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.mf-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.4vw,28px);min-width:0}
.mf-card h2{font-family:var(--sans);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin:0 0 16px}
.mf-card .q{margin:0 0 14px;font-weight:600;line-height:1.5}
.mf-ex .rep p,.try-c p,.mf-ret p{font-family:var(--serif);margin:0 0 10px;line-height:1.7}
.mf-ex .rep p:last-child,.try-c p:last-child,.mf-ret p:last-child{margin-bottom:0}
.try-doc{margin:0 0 10px;padding:12px 14px;border-radius:12px;background:var(--paper);line-height:1.55}
.try-f .btn{margin-top:2px}
.try-c{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--c-soft)}
.try-f.open .fold{grid-template-rows:1fr}
.mf-ret p{font-size:1.05rem}
/* Visuels */
.mv{display:block;width:100%;height:auto;max-width:760px;margin:0 auto}
.mv text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}
.mv .sm{font-size:13px}
.mv .lb{font-size:15px}
.mv .b{font-weight:700}
.mv .tt{font-size:15px;font-weight:700}
.mv .mut{fill:var(--muted)}
.mv .accent{fill:var(--c-ink);font-weight:700}
.mv .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.mv .gd{stroke:var(--line);stroke-width:1}
.mv .ds{stroke:var(--muted);stroke-width:1.3;stroke-dasharray:4 4;fill:none}
.mv .ds.acd{stroke:var(--c)}
.mv .ac{stroke:var(--c);stroke-width:3.5;fill:none;stroke-linejoin:round}
.mv .acd,.mv .acf{fill:var(--c)}
.mv .ac2{stroke:#c9822b;stroke-width:3.5;fill:none;stroke-linejoin:round}
.mv .ac2d{fill:#c9822b}
.mv .br{stroke:var(--c-ink);stroke-width:2;fill:none}
.mv .band-d{fill:rgba(60,60,90,.1)}
.mv .band-l{fill:rgba(255,196,40,.2)}
.mv .cq{stroke:var(--ink);stroke-width:1.6;fill:none}
.mv .rg{stroke:var(--ink);stroke-width:1.2}
.mv .n circle{fill:var(--c)}
.mv .n text{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
html.th-sombre .mv .n text{fill:#16191c}
.mv-leg{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px 22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.mv-leg li{display:flex;gap:10px;align-items:flex-start;font-size:1rem;line-height:1.45}
.mnum{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:.8rem;font-weight:700;line-height:1}
html.th-sombre .mnum{color:#16191c}
.mnum.c1{background:#d9731f}.mnum.c2{background:#2a9d8f}.mnum.c3{background:#3d6fd1}.mnum.c4{background:#c0507a}
html.th-sombre .mnum.c1,html.th-sombre .mnum.c2,html.th-sombre .mnum.c3,html.th-sombre .mnum.c4{color:#fff}
.mnum.in{width:19px;height:19px;font-size:.68rem;vertical-align:3px;margin:0 2px 0 3px}
/* Consigne et réponse argumentée : segments soulignés et numérotés */
.cd-box{background:#fff;border:2px solid #000;padding:16px 18px 10px;color:#000}
.cd-lab{display:inline-block;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:1.15rem;border:2px solid #000;padding:0 .3em;margin:0 0 8px}
.cd-q{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:clamp(1.08rem,.8vw + .95rem,1.35rem);line-height:2.2}
.u{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:7px;-webkit-text-decoration-skip:none;text-decoration-skip-ink:none}
.u1{text-decoration-color:#d9731f}.u2{text-decoration-color:#2a9d8f}.u3{text-decoration-color:#3d6fd1}.u4{text-decoration-color:#c0507a}
.cd-q .u1{font-weight:700}
.arg{font-family:var(--serif);font-size:clamp(1.05rem,.5vw + .98rem,1.2rem);line-height:2.15;padding:14px 16px;border-radius:12px;background:var(--paper)}
.pose-q{margin:0 0 14px;font-weight:600;line-height:1.5}
.pose-q span{display:block;font-family:var(--sans);font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:4px}
/* Calcul posé */
.pose{display:grid;grid-template-columns:auto 1fr;gap:14px 20px;margin:0;align-items:center}
.pose dt{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pose dd{margin:0;font-family:var(--serif);font-size:1.12rem;line-height:1.55;padding:10px 14px;border-radius:10px;background:var(--paper)}
.pose dd.res{font-weight:700;color:var(--c-ink)}
@media (max-width:560px){.pose{grid-template-columns:1fr;gap:6px}.pose dd{margin-bottom:8px}}
/* Compte rendu */
.cr{display:grid;gap:10px}
.cr-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;padding:14px 16px;border-radius:12px;background:var(--paper)}
.cr-row.cr-head{background:none;padding:0 16px;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cr-row b{display:flex;gap:8px;align-items:center;font-size:1.05rem}
.cr-row div p{margin:6px 0 0;font-size:.96rem;color:var(--ink-2);line-height:1.45}
.cr-row .ex{margin:0;font-family:var(--serif);font-size:.98rem;line-height:1.5}
.cr-row .ex i{display:none}
@media (max-width:760px){.cr-row{grid-template-columns:1fr;gap:8px}.cr-row.cr-head{display:none}.cr-row .ex i{display:block;font-style:normal;font-family:var(--sans);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}}
/* Étapes */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:38px 1fr;gap:14px;padding:0 0 20px}
.tl li::after{content:"";position:absolute;left:18px;top:38px;bottom:4px;width:2px;background:var(--line-2)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl-n{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:#fff;color:#000;border:2px solid #000;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:1.1rem}
.tl h3{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 4px;font-family:var(--sans);font-size:1.12rem;font-weight:700;letter-spacing:0}
.tl-ref{display:inline-flex;gap:3px;margin-left:2px}
.tl-ref .mnum{width:21px;height:21px;font-size:.72rem}
.tl p{margin:0;line-height:1.6;color:var(--ink-2)}
.m-e{color:var(--c-ink);font-weight:700}
/* Je vérifie */
.chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chk-b{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--paper);line-height:1.45;font-size:1rem;color:var(--ink)}
.chk-b .box{flex:none;width:22px;height:22px;margin-top:1px;border:2px solid var(--ink-2);border-radius:5px;background:var(--surface);position:relative}
.chk-b[aria-pressed="true"] .box{background:var(--c);border-color:var(--c)}
.chk-b[aria-pressed="true"] .box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.chk-b[aria-pressed="true"] > span:last-child{color:var(--muted)}
/* Repères en cartes */
.rp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.rp div{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px 14px;background:var(--paper);border-radius:12px}
.rp .fr-tag{font-size:1.05rem}
.rp .d{font-size:1rem;line-height:1.45;color:var(--ink-2)}
/* Étapes de l'ECE */
.ece{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.ece-s{background:var(--paper);border-radius:14px;padding:16px 18px}
.ece-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ece-k{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--c-ink)}
.ece-s h3{font-family:var(--sans);font-size:1.12rem;line-height:1.3;margin:0 0 8px;letter-spacing:0}
.ece-s p{margin:0;line-height:1.6;color:var(--ink-2)}
/* Fiche centrale : les quatre étapes */
.crs{display:grid;gap:14px}
.crs-s{background:var(--paper);border-radius:14px;padding:16px 18px}
.crs-h{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.crs-h h3{margin:0;font-family:var(--sans);font-size:1.18rem;letter-spacing:0}
.crs-s > p{margin:0 0 8px;line-height:1.6}
.crs-s ul,.pres-c ul{margin:4px 0 8px;padding-left:20px;line-height:1.55}
.crs-s .tbl{margin:10px 0}
.crs-2{display:grid;gap:12px}
@media (min-width:760px){.crs-2{grid-template-columns:1.4fr 1fr}}
.crs-case{background:var(--surface);border-radius:12px;padding:12px 14px}
.crs-case > b{display:block;margin-bottom:4px}
.crs-case p{margin:0;line-height:1.55}
.crs-note{margin:8px 0 0;font-size:.92rem;color:var(--muted);font-style:italic}
.crs-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.crs-go{font-size:.9rem;font-weight:600;color:var(--c-ink);background:var(--c-soft);border:1px solid var(--c-mid);border-radius:999px;padding:6px 14px;min-height:36px}
@media (hover:hover){.crs-go:hover{border-color:var(--c)}}
/* Stratégie */
.strat{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.strat-b{background:var(--paper);border-radius:14px;padding:14px 16px}
.strat-b b{display:flex;align-items:center;gap:8px;font-size:1.05rem;margin-bottom:6px}
.strat-b p{margin:0;line-height:1.55}
/* Présenter ses résultats */
.pres{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.pres-c{background:var(--paper);border-radius:14px;padding:14px 16px}
.pres-c h3{margin:0;font-family:var(--sans);font-size:1.12rem;letter-spacing:0}
.pres-w{margin:2px 0 10px !important;font-size:.92rem;color:var(--c-ink);font-weight:600;text-align:left !important}
.pres-l{display:block;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
/* Fiche centrale dans la liste */
.mc.feat2{grid-column:1/-1;min-height:0;background:var(--c);border-color:var(--c);padding:22px 24px}
.mc.feat2 .mc-t{font-size:1.4rem;color:#fff}
.mc.feat2 .mc-go{color:#fff}
html.th-sombre .mc.feat2 .mc-t,html.th-sombre .mc.feat2 .mc-go{color:#16191c}
/* Texte justifié dans les fiches */
.mf p,.mf .mv-leg li > span,.mf .chk-b > span:last-child,.mf .rp .d{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.mf-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.mf-nav .btn:last-child:not(:first-child){margin-left:auto}
/* Barre du haut sur petits écrans : rien ne doit dépasser la largeur */
.topbar .wrap{flex-wrap:nowrap;min-width:0}
.crumbs{flex:1 1 0}
@media (max-width:640px){
  .crumbs{display:none}
  .topbar .wrap{gap:6px}
}
@media (max-width:480px){
  .tbtn{padding:6px 8px;font-size:13px}
  .top-actions{gap:5px}
}
@media (max-width:400px){
  .nav-btn.show ~ .top-actions #tutoBtn{display:none}
}
/* Titre du site (accueil) : il ne doit jamais pousser les boutons hors de l'écran */
.brand{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){
  .brand:not(.hide) ~ .top-actions #tutoBtn{display:none}
}
@media (max-width:380px){
  #brand{font-size:.9rem}
  .brand .hw-p{display:none}
}
@media (max-width:340px){#brand{font-size:.8rem}}
/* ===== HALLOWEEN (début) : décor temporaire, à supprimer avec le bloc JS du même nom ===== */
html.hw main{position:relative}
html.hw .brand{white-space:nowrap}
@media (max-width:420px){html.hw .brand{font-size:1rem}html.hw .brand .hw-p{margin-left:.25em}}
html.hw main > .wrap{position:relative;z-index:1}
.hw-web{position:absolute;top:0;width:clamp(70px,12vw,170px);height:clamp(70px,12vw,170px);color:var(--muted);opacity:.42;pointer-events:none;z-index:0}
.hw-web.l{left:0}
.hw-web.r{right:0;transform:scaleX(-1)}
.hw-web svg{display:block;width:100%;height:100%}
html.th-sombre .hw-web{opacity:.4}
.hw-p{display:inline-block;width:1.15em;height:1.08em;vertical-align:-.14em;margin-left:.35em;line-height:0}
.hw-p svg{display:block;width:100%;height:100%;overflow:visible}
.hw-p .pf{fill:#3a2208;transition:fill .3s}
.copy .hw-p{margin:0 .45em 0 0}
.copy{text-align:center}
/* ---------- Mode Noël (laïque) ---------- */
/* Fine guirlande sur les pages autres que l'accueil */
html.noel main{padding-top:4px}
.nl-garl{margin-bottom:clamp(6px,1.6vw,16px);pointer-events:none}
.nl-garl svg{display:block;width:100%;height:auto;max-height:56px}
html.nl-home .nl-garl{display:none}
/* Verrerie */
.nl-fil{stroke:#d9b98f;stroke-width:1.2;fill:none}
.nl-verre{fill:url(#nlVerre);stroke:rgba(235,240,255,.85);stroke-width:1.1;stroke-linejoin:round}
.nl-bord{fill:rgba(235,240,255,.75)}
.nl-reflet{fill:#fff;opacity:.75}
.nl-refletC{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:.65}
.nl-liq,.nl-liqB{opacity:.88}
.nl-menisque{opacity:.55}
.nl-liege{fill:#c99a66}
.nl-liegeL{stroke:#9c6f42;stroke-width:1}
.nl-grad{stroke:rgba(255,255,255,.8);stroke-width:1}
.nl-metal{fill:url(#nlMetal)}
.nl-chrome{fill:url(#nlChrome)}
.nl-or{fill:url(#nlLaiton)}
.nl-lame{fill:rgba(220,235,255,.85)}
.nl-ombreO{fill:rgba(0,0,0,.3)}
@keyframes nlBrille{0%,100%{opacity:.7}50%{opacity:1}}
html.nl-fete .nl-liq{animation:nlBrille .7s ease-in-out infinite}
html.nl-pause .nl-scene *{animation-play-state:paused !important}
/* Fond : violet du soir (accueil, avec les rondins du chalet) et violet sobre (autres pages) */
html.nl-nuit{--paper:#3a2c5a;--surface:#47386c;--ink:#f6f0ff;--ink-2:#e1d6f5;--muted:#b9abd6;--line:#5b4a85;--line-2:#71609c;background:#2b2147}
html.nl-nuit body{background:linear-gradient(180deg,#45356f 0%,#3a2c5e 45%,#2f2550 100%)}
html.nl-nuit .topbar,html.nl-nuit .tabs{background:#3a2c5a}
html.nl-nuit.nl-home body{background:linear-gradient(180deg,rgba(80,52,140,.55),rgba(60,40,100,.25) 45%,rgba(255,150,70,.08)),repeating-linear-gradient(180deg,#6f4a63 0 38px,#5b3a50 38px 42px)}
/* Scène de l'accueil sur toute la largeur */
.nl-scene{position:relative;width:100vw;margin:-4px 0 26px calc(50% - 50vw);line-height:0;overflow:hidden}
.nl-scene svg{display:block;width:100%;height:clamp(300px,37vw,480px)}
.nl-poutre{fill:#3f2533}
.nl-cadre{fill:#4e2e22}
.nl-meneau{stroke:#4e2e22;stroke-width:8}
.nl-console{fill:#5b3826}
.nl-pot{fill:rgba(255,255,255,.22);stroke:rgba(235,240,255,.8);stroke-width:1}
.nl-couvercle{fill:url(#nlChrome)}
.nl-etiq{fill:#f4ead8}
.nl-plan{fill:#2e2635}
.nl-tiroir{fill:none;stroke:rgba(0,0,0,.25);stroke-width:2}
.nl-petri{fill:rgba(255,255,255,.35);stroke:rgba(235,240,255,.8)}
.nl-gelose{fill:#f2d58a;opacity:.8}
.nl-carnet{fill:#8b3a3a;stroke:#f4ead8;stroke-width:1.5}
.nl-cordon{stroke:#22161c;stroke-width:2}
.nl-ampoule{fill:#fff1c4}
.nl-halo{opacity:.55}
.nl-pierre{fill:url(#nlPierre);stroke:#5b4a42;stroke-width:1.5;opacity:.9}
.nl-foyer{fill:#1d120f}
.nl-buche{fill:#6b4029}
.nl-buche2{fill:#7b4c35}
.nl-braise{fill:#ff7a2e;opacity:.6}
.nl-flamme{fill:#ff8a2b}
.nl-flamme2{fill:#ffbe3d}
.nl-flamme3{fill:#fff1a8}
/* Les flammes sont immobiles : elles ne s'animent que lorsqu'on clique sur la cheminée (aucune animation permanente) */
.nl-flamme,.nl-flamme2{transform-box:fill-box;transform-origin:50% 100%}
@keyframes nlFeu{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.07) scaleX(.97)}}
.nl-etincelle{fill:#ffd27a;opacity:0}
.nl-etoile0{fill:#fff;opacity:.75}
.nl-mont{fill:#8d86c4}
.nl-cime{fill:#f4f0ff}
.nl-foret{fill:#4b4985;opacity:.9}
.nl-neigeD{fill:#ece6f7}
.nl-murD{fill:#8a5a43}
.nl-toitD{fill:#f4f0fb}
.nl-fenD{fill:#ffc85e}
/* Objets cliquables : un léger éclat au survol */
.nl-chem,.nl-react,.nl-fenetre,.nl-lampe,.nl-micro,.nl-livre{cursor:pointer;outline:none}
@media (hover:hover){.nl-livre:hover{filter:brightness(1.2)}}
@media (hover:hover){.nl-micro:hover,.nl-lampe:hover,.nl-react:hover{filter:brightness(1.18)}}
.nl-micro:focus-visible .nl-chrome,.nl-lampe:focus-visible path{stroke:#fff;stroke-width:2}
/* Surprise 1 : le feu s'emballe */
html.nl-fete .nl-flamme,html.nl-fete .nl-flamme2{animation:nlFeu .45s ease-in-out infinite;transform:scale(1.15)}
html.nl-fete .nl-braise{opacity:.95}
html.nl-fete .nl-etincelle{animation:nlEtincelle 1.4s ease-out infinite}
@keyframes nlEtincelle{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(8px,-110px)}}
/* Surprise 2 : réaction chimique dans le ballon */
.nl-bulles circle{fill:rgba(255,255,255,.85);opacity:0}
.nl-mousse{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
html.nl-reaction .nl-react .nl-liqB{animation:nlCouleur 4s linear forwards}

/* ---------- Activités et consignes : blocs encadrés avec bandeau (bleu = activité, jaune = TP) ---------- */
.act2,.vw-in{--fr:#D4EBF8;--frd:#5f9fcf;--frs:#eef7fd}
.act2.ab-tp,.vw-in.ab-tp{--fr:#FDFFD2;--frd:#bdb23c;--frs:#fffff0}
.act2{border:2px solid var(--frd);border-radius:12px;overflow:hidden;background:var(--surface)}
.act2 > .act2-head{border-radius:0}
.act2.open > .act2-head{border-bottom:2px solid var(--frd)}
.act2-b{padding:16px;display:grid;gap:14px;border-radius:0}
.ab{border:2px solid var(--frd);border-radius:10px;overflow:hidden;background:var(--surface);margin:0}
.ab-h{display:flex;align-items:center;gap:10px;margin:0;padding:8px 14px;background:var(--fr);border-bottom:2px solid var(--frd);font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:1rem;line-height:1.3;color:#000;text-align:left}

.ab-cherche{margin:0;padding:10px 14px;border:2px dashed var(--frd);border-radius:10px;background:var(--frs);font-family:var(--serif);font-style:italic;font-weight:600;line-height:1.5;color:var(--ink)}
.ab-cherche.in{margin-top:10px;border-width:1.5px}
.ab-view{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:10px 14px;border:2px solid var(--frd);border-radius:8px;background:var(--fr);font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:.98rem;color:#000;cursor:pointer}

.ab-ret{border-color:var(--c)}

     {titre: "Les chromosomes, support de l'information génétique", blocs: [

      "Selon le moment du [[cycle cellulaire]], cette chromatine peut être **plus ou moins condensée**. La plupart du temps, elle est décondensée : c'est sous cette forme que l'information génétique peut être utilisée par la cellule. Elle se condense fortement au moment de la division : c'est ce qui explique que les chromosomes ne soient nettement visibles au microscope optique que lors de la division.",
      "Le cycle cellulaire comprend une **[[interphase]]**, formée des phases G1, S et G2, puis la division, ou phase M. En G1, chaque chromosome est un **[[chromosome simple]]**, formé d'une seule [[chromatide]]. Pendant la **[[phase S]]**, l'ADN est répliqué : chaque chromosome devient un **[[chromosome double]]**, formé de deux chromatides sœurs identiques réunies au niveau du [[centromère]]. Le nombre de chromosomes ne change pas, mais la quantité d'ADN double. L'information génétique, présente en un seul exemplaire, est ainsi dupliquée avant la division.",
      {table: {legende: "Exemple d'une cellule à 2n = 4 (q = quantité d'ADN en G1)", entetes: ["Phase", "Chromosomes", "Chromatides", "Quantité d'ADN"],
       lignes: [["G1", "4 simples", "4", "q"], ["S", "4 (duplication)", "4 → 8", "q → 2q"], ["G2", "4 doubles", "8", "2q"], ["Cellule fille", "4 simples", "4", "q"]]}},
      {aside: "Repère historique", texte: "Au début des années 1950, Alma Howard et Stephen Pelc montrent, sur des racines de fève, que la synthèse d'ADN n'a lieu que pendant une période limitée du cycle. En 1953, ils proposent les noms G1, S, G2 et M ; la lettre G vient de l'anglais *gap*, « intervalle »."}
     ]},
     {titre: "La mitose, une reproduction conforme", blocs: [
      "Au cours de la **[[mitose]]**, les chromosomes doubles se condensent et deviennent visibles : c'est la **[[prophase]]**. Ils s'alignent ensuite au centre de la cellule, sur la [[plaque équatoriale]] : c'est la **[[métaphase]]**. Les deux chromatides sœurs de chaque chromosome se séparent alors et migrent vers les deux pôles opposés de la cellule, grâce au **[[fuseau mitotique]]** : c'est l'**[[anaphase]]**. Enfin, les chromosomes se décondensent et deux noyaux se reforment : c'est la **[[télophase]]**, suivie de la séparation des deux cellules filles.",
      {table: {legende: "Reconnaître les étapes de la mitose au microscope", entetes: ["Étape", "Au microscope", "Chromosomes"],
       lignes: [["Prophase", "Noyau « en pelote »", "Condensation des chromosomes doubles"], ["Métaphase", "Ligne sombre au centre de la cellule", "Chromosomes alignés sur la plaque équatoriale"], ["Anaphase", "Deux lots qui s'éloignent vers les pôles", "Séparation des chromatides sœurs"], ["Télophase", "Deux noyaux aux extrémités", "Décondensation, deux noyaux se reforment"]]}},
      "Au cours du cycle cellulaire, la quantité d'ADN d'une cellule double pendant la phase S, reste stable en G2, puis revient à sa valeur initiale dans chaque cellule fille à la fin de la mitose.",
      "La mitose assure ainsi une **[[reproduction conforme]]** : les chromatides sont réparties équitablement entre les deux cellules filles. Celles-ci possèdent donc le même nombre de chromosomes et la même information génétique que la cellule mère, sauf mutation. C'est ce qui permet la croissance d'un organisme et le renouvellement permanent de ses cellules, comme celui de l'épiderme."
     ]},
     {titre: "Caryotype, cellules diploïdes et haploïdes", blocs: [
      "Un **[[caryotype]]** est une représentation ordonnée des chromosomes d'une cellule, classés selon leur taille, leur forme et la position de leur centromère. On les regroupe ensuite par paires de [[chromosomes homologues]] : les deux chromosomes d'une paire portent les mêmes gènes aux mêmes emplacements ; l'un provient du père, l'autre de la mère. Chez l'être humain, on obtient 23 paires, dont une paire de chromosomes sexuels : XX chez la femme, XY chez l'homme.",
      "Dans une cellule **[[diploïde]]**, chaque type de chromosome est présent **en deux exemplaires** formant une paire de chromosomes homologues : on note **2n**. Une cellule **[[haploïde]]** n'en possède **qu'un seul exemplaire** : on note **n**. Chez l'être humain, les cellules du corps sont diploïdes (**2n = 46**), tandis que les [[gamètes|gamète]] sont haploïdes (**n = 23**). Les mesures historiques de la quantité d'ADN des noyaux le confirment : un spermatozoïde contient environ deux fois moins d'ADN qu'une cellule du corps.",
      "Lors de la **[[fécondation]]**, l'union des deux lots haploïdes rétablit l'état diploïde de la cellule-œuf, ce qui maintient le nombre de chromosomes d'une génération à l'autre. Or la mitose conserve le nombre de chromosomes : la formation de cellules haploïdes à partir de cellules diploïdes suppose donc une division particulière : la méiose."
     ]},
     {titre: "La méiose, à l'origine des cellules haploïdes", blocs: [
      "La **[[méiose]]** est la division qui produit des cellules haploïdes. Avant la méiose, l'ADN est répliqué une seule fois : chaque chromosome est double. La méiose comprend ensuite **deux divisions successives**, sans nouvelle réplication entre elles.",
      "La première, la **[[division réductionnelle]]**, **sépare les chromosomes homologues** : chacune des deux cellules obtenues ne possède plus qu'un chromosome de chaque paire. Elle est donc haploïde, mais ses chromosomes sont encore doubles. La seconde, la **[[division équationnelle]]**, **sépare les chromatides sœurs**, comme une mitose. Ces déplacements sont assurés par le [[fuseau méiotique]] : chez une plante mutante dont le fuseau est perturbé, les chromosomes sont mal répartis. Une cellule diploïde produit ainsi quatre cellules haploïdes, à l'origine des gamètes.",
      {table: {legende: "Comparer mitose et méiose", entetes: ["", "Mitose", "Méiose"],
       lignes: [["Réplication de l'ADN", "Une, avant la division", "Une, avant les deux divisions"], ["Nombre de divisions", "1", "2 successives"], ["Cellules produites", "2", "4"], ["Nombre de chromosomes", "Conservé (2n → 2n)", "Divisé par deux (2n → n)"], ["Ce qui se sépare", "Chromatides sœurs", "Homologues (1re division), puis chromatides sœurs (2e division)"], ["Rôle", "Croissance, renouvellement des cellules", "Formation des gamètes"]]}}
     ]}
    ],

     {texte: "Selon le moment du cycle cellulaire, cette chromatine peut être plus ou moins condensée, ce qui explique que les chromosomes ne soient nettement visibles au microscope optique que lors de la division."},

     {texte: "Chez l'être humain, les cellules du corps sont diploïdes (2n = 46), tandis que les gamètes sont haploïdes (n = 23). La fécondation réunit deux lots haploïdes et rétablit l'état diploïde."},

   qcm: [
    {n: 1, q: "Un chromosome double est constitué de :", o: ["deux chromosomes homologues réunis par le centromère", "deux chromatides sœurs réunies par le centromère", "deux chromatides, l'une paternelle et l'autre maternelle", "deux chromosomes simples différents, accolés"], r: 1, e: "Les deux chromatides sœurs sont identiques : elles viennent de la copie d'une même molécule d'ADN. Un chromosome double reste UN seul chromosome ; les homologues, eux, sont deux chromosomes distincts."},
    {n: 1, q: "Pendant quelle phase du cycle cellulaire l'ADN est-il dupliqué ?", o: ["G1", "S", "G2", "Mitose"], r: 1, e: "S = synthèse de l'ADN. Chaque chromosome passe de l'état simple à l'état double."},
    {n: 1, q: "Une cellule somatique humaine contient :", o: ["23 chromosomes", "44 chromosomes", "46 chromosomes", "92 chromosomes"], r: 2, e: "46 chromosomes, soit 23 paires de chromosomes homologues."},
    {n: 1, q: "La chromatine correspond à :", o: ["l'ADN associé à des protéines, dans le noyau", "l'ADN seul, sans protéines, dans le noyau", "les protéines du noyau, sans l'ADN", "l'ADN d'un chromosome, seulement pendant la mitose"], r: 0, e: "La chromatine est de l'ADN associé à des protéines. Elle est décondensée en interphase et se condense en chromosomes visibles lors de la division."},
    {n: 1, q: "À quelle phase de la mitose les chromosomes sont-ils alignés sur la plaque équatoriale ?", o: ["Prophase", "Métaphase", "Anaphase", "Télophase"], r: 1, e: "En métaphase, les centromères des chromosomes doubles sont alignés au centre de la cellule."},
    {n: 1, q: "Quel est l'ordre correct des phases de la mitose ?", o: ["Prophase – anaphase – métaphase – télophase", "Métaphase – prophase – anaphase – télophase", "Prophase – métaphase – anaphase – télophase", "Télophase – anaphase – métaphase – prophase"], r: 2, e: "Moyen mnémotechnique : P-M-A-T."},
    {n: 1, q: "Chez l'être humain, un gamète possède :", o: ["23 paires de chromosomes homologues", "23 chromosomes, un de chaque paire", "46 chromosomes à une chromatide", "22 chromosomes, sans chromosome sexuel"], r: 1, e: "Un gamète est haploïde : un seul exemplaire de chaque chromosome, soit n = 23, dont un chromosome sexuel."},
    {n: 1, q: "La fécondation :", o: ["fait passer de l'état diploïde à l'état haploïde", "réunit deux cellules haploïdes en une cellule diploïde", "réunit deux cellules diploïdes en une cellule-œuf", "divise par deux le nombre de chromosomes"], r: 1, e: "Deux gamètes haploïdes (n) fusionnent : la cellule-œuf est diploïde (2n). C'est la méiose, et non la fécondation, qui divise par deux le nombre de chromosomes."},
    {n: 2, q: "Une cellule possède 8 chromosomes en G1. Combien de chromosomes et de chromatides possède-t-elle en G2 ?", o: ["8 chromosomes et 8 chromatides", "16 chromosomes et 16 chromatides", "8 chromosomes et 16 chromatides", "4 chromosomes et 8 chromatides"], r: 2, e: "La phase S double le nombre de chromatides mais pas le nombre de chromosomes : 8 chromosomes doubles = 16 chromatides."},
    {n: 2, q: "Pendant la phase S, la quantité d'ADN de la cellule :", o: ["reste constante", "double", "est divisée par deux", "est multipliée par quatre"], r: 1, e: "Chaque molécule d'ADN est copiée : la quantité passe de q à 2q (de 2 à 4 u.a. dans le TP)."},
    {n: 2, q: "Au microscope, on voit deux lots de chromosomes qui s'éloignent vers les pôles opposés. Il s'agit :", o: ["d'une prophase", "d'une métaphase", "d'une anaphase", "d'une télophase"], r: 2, e: "En anaphase, les chromatides sœurs se séparent et sont tirées vers les pôles par le fuseau."},
    {n: 2, q: "Pourquoi dit-on que la mitose est une reproduction conforme ?", o: ["Les deux cellules filles ont le même caryotype que la cellule mère", "Les deux cellules filles ont chacune la moitié des chromosomes de la cellule mère", "Les deux cellules filles reçoivent chacune un chromosome de chaque paire", "Les quatre cellules filles ont le même caryotype que la cellule mère"], r: 0, e: "La mitose donne deux cellules (et non quatre) qui ont le même nombre de chromosomes et la même information génétique que la cellule mère. Moitié des chromosomes ou un chromosome de chaque paire : c'est la méiose."},
    {n: 2, q: "Le rôle du fuseau mitotique est de :", o: ["séparer les deux brins de chaque molécule d'ADN", "rapprocher les chromosomes homologues d'une même paire", "répartir les chromatides sœurs vers les pôles opposés", "condenser la chromatine en chromosomes visibles"], r: 2, e: "Les fibres du fuseau s'attachent aux centromères et déplacent les chromatides vers les pôles. Le fuseau ne touche ni aux brins de l'ADN ni à la condensation."},
    {n: 2, q: "Deux chromosomes homologues :", o: ["sont deux copies identiques produites lors de la phase S", "portent les mêmes gènes, mais pas forcément les mêmes allèles", "portent les mêmes allèles, mais pas les mêmes gènes", "sont réunis par un centromère jusqu'à l'anaphase"], r: 1, e: "L'un vient du père, l'autre de la mère : mêmes gènes aux mêmes emplacements, allèles parfois différents. Les copies identiques réunies par un centromère sont les chromatides sœurs."},
    {n: 2, q: "Une cellule diploïde à 2n = 6 subit une méiose. On obtient :", o: ["2 cellules à 6 chromosomes", "4 cellules à 6 chromosomes", "4 cellules à 3 chromosomes", "2 cellules à 3 chromosomes"], r: 2, e: "Méiose : 4 cellules haploïdes, n = 3. Une mitose aurait donné 2 cellules à 6 chromosomes."},
    {n: 2, q: "Lors de la méiose, les chromosomes homologues se séparent :", o: ["en anaphase de mitose", "en anaphase I", "en anaphase II", "pendant la phase S"], r: 1, e: "La division réductionnelle sépare les homologues en anaphase I ; les chromatides sœurs se séparent en anaphase II."},
    {n: 2, q: "Entre la méiose I et la méiose II :", o: ["l'ADN est répliqué une seconde fois", "il n'y a pas de réplication de l'ADN", "les chromosomes redeviennent simples", "les cellules redeviennent diploïdes"], r: 1, e: "Une seule réplication précède les deux divisions. Les chromosomes restent doubles jusqu'à l'anaphase II, et les cellules sont haploïdes dès la fin de la méiose I."},
    {n: 2, q: "Une cellule a terminé la phase S et n'a pas encore commencé la mitose. Elle est en :", o: ["G1, avec des chromosomes simples", "G1, avec des chromosomes doubles", "G2, avec des chromosomes simples", "G2, avec des chromosomes doubles"], r: 3, e: "G2 est l'intervalle entre la phase S et la mitose. L'ADN vient d'être copié : chaque chromosome a deux chromatides."},
    {n: 2, q: "Dans un méristème, pourquoi observe-t-on surtout des cellules en interphase ?", o: ["Parce que les cellules d'un méristème se divisent rarement", "Parce que l'interphase dure plus longtemps que la mitose", "Parce que la mitose dure plus longtemps que l'interphase", "Parce que le colorant ne marque que les noyaux en interphase"], r: 1, e: "À un instant donné, plus une phase est longue, plus on y trouve de cellules. Un méristème est au contraire une zone où les cellules se divisent beaucoup."},
    {n: 2, q: "Quel critère ne peut PAS servir à classer les chromosomes d'un caryotype ?", o: ["Leur taille", "La position du centromère", "Leur motif de bandes", "Leur origine paternelle ou maternelle"], r: 3, e: "On ne voit pas l'origine d'un chromosome sur un caryotype : on classe selon la taille, le centromère et les bandes."},
    {n: 2, q: "Les cellules d'organes d'un bœuf contiennent ≈ 6 pg d'ADN, un spermatozoïde 3,3 pg. On en déduit que :", o: ["le spermatozoïde contient deux lots de chromosomes", "le spermatozoïde contient un seul lot de chromosomes", "le spermatozoïde a des chromosomes doubles", "les cellules des organes sont haploïdes"], r: 1, e: "Le rapport est proche de 2 : le gamète contient deux fois moins d'ADN, donc un seul lot de chromosomes (haploïde), contre deux lots dans les cellules des organes."},
    {n: 3, q: "Chez la drosophile (2n = 8), à la fin de la méiose I, on obtient :", o: ["2 cellules diploïdes à 8 chromosomes simples", "2 cellules haploïdes à 4 chromosomes doubles", "4 cellules haploïdes à 4 chromosomes simples", "2 cellules haploïdes à 4 chromosomes simples"], r: 1, e: "Après la méiose I, les cellules sont déjà haploïdes (n = 4) mais leurs chromosomes sont encore doubles."},
    {n: 3, q: "Un organisme a 2n = 8. Combien de chromatides compte une de ses cellules en métaphase de mitose ?", o: ["4", "8", "16", "32"], r: 2, e: "8 chromosomes, tous doubles en métaphase : 16 chromatides."},
    {n: 3, q: "Cellule d'un organisme 2n = 4 : chaque pôle reçoit 2 chromosomes simples, un seul de chaque paire. Il s'agit :", o: ["d'une anaphase de mitose", "d'une anaphase I", "d'une anaphase II", "d'une métaphase I"], r: 2, e: "Chromosomes simples → chromatides séparées ; un seul de chaque paire → cellule déjà haploïde : anaphase II. En mitose, chaque pôle recevrait 4 chromosomes."},
    {n: 3, q: "Des chromosomes doubles, associés par paires d'homologues, sont alignés de part et d'autre du plan équatorial. Il s'agit :", o: ["d'une métaphase de mitose", "d'une métaphase I", "d'une métaphase II", "d'une prophase"], r: 1, e: "Les homologues appariés n'existent qu'en méiose I : c'est une métaphase I."},
    {n: 3, q: "Une cellule en G1 contient une quantité d'ADN Q. Quelle quantité contient chaque cellule obtenue à la fin de la méiose ?", o: ["2Q", "Q", "Q/2", "Q/4"], r: 2, e: "Réplication : Q → 2Q. Méiose I : 2Q → Q. Méiose II : Q → Q/2."},
    {n: 3, q: "Une image montre une anaphase, sans qu'on puisse compter les chromosomes. Que peut-on conclure ?", o: ["C'est une mitose : seule la mitose a une anaphase", "C'est une méiose I : des chromosomes se séparent", "Rien de sûr : il faut savoir ce qui se sépare", "C'est une méiose II : les lots sont identiques"], r: 2, e: "Il faudrait savoir si ce sont des chromatides sœurs (mitose, anaphase II) ou des chromosomes homologues (anaphase I) qui se séparent."},
    {n: 3, q: "Une plante mutante a un fuseau méiotique perturbé. On s'attend à :", o: ["une réplication de l'ADN incomplète avant la méiose", "des chromosomes mal répartis entre les cellules produites", "des chromosomes restés décondensés pendant la méiose", "quatre cellules haploïdes au caryotype normal"], r: 1, e: "Le fuseau répartit les chromosomes : s'il est perturbé, la répartition est anormale. Il n'intervient ni dans la réplication ni dans la condensation. Chez le mutant d'Arabidopsis, 97,5 % des produits de méiose sont anormaux."},
    {n: 3, q: "Un caryotype présente 44 chromosomes organisés en 22 paires. Il s'agit :", o: ["d'un gamète, car on compte 22 paires", "d'une cellule diploïde, car les chromosomes vont par paires", "d'une cellule haploïde, car 44 est inférieur à 46", "d'une cellule en G2, car les chromosomes sont doubles"], r: 1, e: "Des chromosomes organisés en paires d'homologues caractérisent une cellule diploïde, quelle que soit l'espèce. Un gamète de cet individu aurait 22 chromosomes, sans paires."}

   essentiel: {
    sections: [
     {titre: "Des erreurs de réplication à l'origine de mutations spontanées", blocs: [
      "Lors de la réplication, l'**[[ADN polymérase]]** copie l'ADN **avec une grande fidélité** : en face de chaque nucléotide du [[brin matrice]], elle place le nucléotide complémentaire. Des **erreurs aléatoires** peuvent toutefois survenir : un nucléotide non complémentaire est parfois placé en face du brin matrice. Cette erreur ne concerne d'abord qu'un seul brin ; lors de la réplication suivante, elle est copiée et se retrouve sur les deux brins. C'est alors une **[[mutation]]**, c'est-à-dire une modification de la [[séquence]] des nucléotides de l'ADN. Les mutations qui apparaissent ainsi, sans intervention d'un facteur extérieur, sont des **[[mutations spontanées|mutation spontanée]]**.",
      "La fréquence des mutations spontanées est faible pour un nucléotide donné : environ une substitution pour 10⁸ nucléotides à chaque génération. Mais le génome compte plus de 6 milliards de nucléotides : les mutations se produisent donc régulièrement à l'échelle du génome, et chaque enfant porte plusieurs dizaines de mutations nouvelles.",
      "La nature des mutations varie. Lors d'une **[[substitution]]**, un nucléotide est remplacé par un autre ; lors d'une **[[insertion]]**, un ou plusieurs nucléotides sont ajoutés ; lors d'une **[[délétion]]**, un ou plusieurs nucléotides sont perdus."

      "Les effets des mutations sur le [[phénotype]] sont variables. Certaines mutations modifient la protéine produite et peuvent être à l'origine d'une maladie : c'est le cas de la [[drépanocytose]], due à la substitution d'un seul nucléotide dans un gène de l'[[hémoglobine]]. L'effet d'une mutation dépend de sa nature et de sa position. Beaucoup de mutations ont des effets **non observables**. Lorsqu'il existe, l'effet d'une mutation peut s'observer à l'échelle de la molécule, de la cellule ou de l'organisme."

     {titre: "Le devenir d'une mutation", blocs: [
      "Une mutation est copiée à chaque réplication : elle est donc conservée dans les cellules issues des divisions de la cellule où elle est apparue, c'est-à-dire dans le [[clone]] issu de cette cellule. Son devenir dépend alors du type de cellule touchée.",
      "Chez les animaux, dont l'être humain, une **[[mutation somatique]]**, survenue dans une [[cellule somatique]], reste dans le clone issu de cette cellule : elle n'est pas transmise aux descendants. Si la mutation apparaît dans la lignée germinale, c'est-à-dire dans une [[cellule germinale]], elle peut être transmise à la descendance par un [[gamète]] : c'est une **[[mutation germinale]]**. Présente dès la cellule-œuf, elle se retrouve alors dans toutes les cellules de l'enfant et devient potentiellement héréditaire.",

     {titre: "Des agents mutagènes à l'origine de mutations induites", blocs: [

      "Absorbés par l'ADN, les UV provoquent des lésions de l'ADN, comme les dimères de thymines, formés de deux thymines voisines d'un même brin soudées entre elles. Si les lésions sont trop nombreuses, l'ADN ne peut plus être copié et la cellule meurt. Si la cellule survit, lors de la réplication, une lésion peut conduire à une erreur de copie : l'ADN polymérase place un nucléotide non complémentaire en face de la lésion, et après la réplication suivante, c'est une **mutation**.",
      "Comme les mutations spontanées, les mutations induites ne sont pas dirigées vers les besoins de l'organisme : elles apparaissent au hasard. Dans la peau, ces mutations sont somatiques : elles peuvent favoriser l'apparition de cancers, mais elles ne sont pas transmises aux enfants.",
